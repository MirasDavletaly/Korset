<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A7EA4">
<meta name="description" content="Korset — карта Астаны: 2D и 3D, поиск адресов и организаций, рубрики и маршруты. Работает целиком в браузере.">
<title>Korset — карта Астаны</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230A7EA4'/%3E%3Cpath d='M16 27s-7.5-6.6-7.5-12.6a7.5 7.5 0 0 1 15 0C23.5 20.4 16 27 16 27z' fill='%23fff'/%3E%3Ccircle cx='16' cy='14.4' r='3.2' fill='%23F4B400'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="preload" href="data/base.json" as="fetch" crossorigin>
<link rel="preload" href="data/buildings.json" as="fetch" crossorigin>
<link rel="preload" href="data/places.json" as="fetch" crossorigin>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <div id="map" role="region" aria-label="Карта Астаны"></div>

  <div class="ctrls" id="ctrls">
    <div class="ctrl-group">
      <button class="ctrl" id="zoomIn" type="button" title="Приблизить" aria-label="Приблизить"></button>
      <button class="ctrl" id="zoomOut" type="button" title="Отдалить" aria-label="Отдалить"></button>
    </div>
    <button class="ctrl solo" id="compassBtn" type="button" title="На север" aria-label="Повернуть карту на север" hidden></button>
    <button class="ctrl solo" id="locateBtn" type="button" title="Моё местоположение" aria-label="Моё местоположение"></button>
    <button class="ctrl solo" id="btn3d" type="button" title="Объёмные здания (3D)" aria-label="Переключить 2D/3D" aria-pressed="false"><span class="txt">3D</span></button>
    <button class="ctrl solo" id="themeBtn" type="button" title="Тёмная тема" aria-label="Переключить тему"></button>
  </div>

  <aside class="panel" id="panel" data-view="home" aria-label="Поиск и информация">
    <div class="sheet-grab" id="sheetGrab" aria-hidden="true"><span></span></div>
    <div class="panel-head" id="panelHead">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0A7EA4"/><path d="M16 27s-7.5-6.6-7.5-12.6a7.5 7.5 0 0 1 15 0C23.5 20.4 16 27 16 27z" fill="#fff"/><circle cx="16" cy="14.4" r="3.2" fill="#F4B400"/></svg>
        <span class="brand-name">Korset</span>
        <span class="brand-city">Астана</span>
      </div>
      <div class="search" id="searchWrap">
        <div class="field">
          <span id="qIcon"></span>
          <input id="q" type="search" placeholder="Адрес, место или рубрика" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                 role="combobox" aria-expanded="false" aria-controls="qList" aria-autocomplete="list" aria-label="Поиск по Астане">
          <button class="field-btn" id="qClear" type="button" aria-label="Очистить поиск" hidden></button>
        </div>
        <div class="suggest" id="qList" role="listbox" aria-label="Подсказки" hidden></div>
      </div>
      <div class="chips" id="chips" role="toolbar" aria-label="Рубрики"></div>
    </div>
    <div class="panel-body" id="panelBody">
      <section class="view home" id="vHome" data-view="home"></section>
      <section class="view" id="vResults" data-view="results" hidden></section>
      <section class="view" id="vPlace" data-view="place" hidden></section>
      <section class="view" id="vRoute" data-view="route" hidden>
        <div class="route-top" id="routeTop">
          <div class="view-bar">
            <button class="icon-btn" type="button" data-act="route-close" aria-label="Закрыть маршрут" title="Закрыть маршрут" id="routeClose"></button>
            <h2>Маршрут</h2>
            <span class="route-sum" id="routeSum"></span>
          </div>
        </div>
        <div class="rp">
          <span class="badge badge-a">А</span>
          <div class="search">
            <div class="field">
              <input id="rA" type="search" placeholder="Откуда" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="rAList" aria-autocomplete="list" aria-label="Точка А, откуда">
              <button class="field-btn" type="button" data-clear="a" aria-label="Очистить точку А" hidden></button>
            </div>
            <div class="suggest" id="rAList" role="listbox" hidden></div>
          </div>
          <button class="icon-btn" type="button" id="rMyLoc" title="Моё местоположение как точка А" aria-label="Моё местоположение как точка А"></button>
        </div>
        <div class="rp">
          <span class="badge badge-b">Б</span>
          <div class="search">
            <div class="field">
              <input id="rB" type="search" placeholder="Куда" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="rBList" aria-autocomplete="list" aria-label="Точка Б, куда">
              <button class="field-btn" type="button" data-clear="b" aria-label="Очистить точку Б" hidden></button>
            </div>
            <div class="suggest" id="rBList" role="listbox" hidden></div>
          </div>
          <button class="icon-btn" type="button" id="rSwap" title="Поменять точки местами" aria-label="Поменять точки местами"></button>
        </div>
        <div class="modes" id="modes" role="group" aria-label="Способ передвижения"></div>
        <div id="routeBody"></div>
      </section>
    </div>
  </aside>

  <div class="ctx" id="ctx" role="menu" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="attrib">Данные © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">участники OpenStreetMap</a>, ODbL · <span id="dataDate"></span></div>

  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-box">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0A7EA4"/><path d="M16 27s-7.5-6.6-7.5-12.6a7.5 7.5 0 0 1 15 0C23.5 20.4 16 27 16 27z" fill="#fff"/><circle cx="16" cy="14.4" r="3.2" fill="#F4B400"/></svg>
      <p class="loader-title">Korset · Астана</p>
      <p class="loader-text" id="loaderText">Загружаем карту</p>
      <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
    </div>
  </div>
  <div class="fatal" id="fatal" hidden></div>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">Для работы карты нужен JavaScript.</p></noscript>
</body>
</html>
