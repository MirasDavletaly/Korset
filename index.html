<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A7EA4">
<meta name="description" content="Korset — карта Астаны: поиск адресов, справочник организаций и маршруты на открытых данных OpenStreetMap.">
<title>Korset — карта Астаны</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230A7EA4'/%3E%3Cpath d='M16 27s-7.5-6.6-7.5-12.6a7.5 7.5 0 0 1 15 0C23.5 20.4 16 27 16 27z' fill='%23fff'/%3E%3Ccircle cx='16' cy='14.4' r='3.2' fill='%23F4B400'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
<style>
:root{
  --brand:#0A7EA4;--brand-strong:#086A8A;--brand-soft:rgba(10,126,164,.12);--brand-ink:#fff;
  --gold:#F4B400;
  --surface:#fff;--surface-2:#F2F4F7;--surface-3:#E3E7EC;--hover:rgba(15,23,42,.055);
  --line:rgba(15,23,42,.09);--text:#111827;--text-2:#4B5563;--text-3:#8A94A3;
  --ok:#12804C;--warn:#B95F00;--bad:#CF3A3A;
  --a:#12A150;--b:#E5484D;
  --shadow:0 1px 2px rgba(15,23,42,.08),0 8px 28px rgba(15,23,42,.14);
  --shadow-sm:0 1px 2px rgba(15,23,42,.12),0 2px 8px rgba(15,23,42,.08);
  --attrib-bg:rgba(255,255,255,.86);
  --skel:#EBEEF2;--skel-hi:#F6F7F9;
  --map-bg:#F8F4F0;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --panel-w:400px;--r:18px;
}
:root[data-theme="dark"]{
  --brand:#3BB4DA;--brand-strong:#62C6E6;--brand-soft:rgba(59,180,218,.16);--brand-ink:#04232D;
  --surface:#1B1F25;--surface-2:#252B32;--surface-3:#343B44;--hover:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09);--text:#EEF1F4;--text-2:#B3BCC6;--text-3:#7F8A96;
  --ok:#3ECF8E;--warn:#F5A524;--bad:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --attrib-bg:rgba(22,25,30,.82);
  --skel:#262C33;--skel-hi:#313841;
  --map-bg:#0C0C0C;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);font-size:15px;line-height:1.4;color:var(--text);background:var(--map-bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#map{position:absolute;inset:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.flip{transform:scaleX(-1)}
[hidden]{display:none!important}

/* ---------- Панель ---------- */
.panel{position:absolute;z-index:10;top:12px;left:12px;width:var(--panel-w);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.panel.tall{bottom:12px}
.sheet-grab{display:none}
.panel-head{flex:none;position:relative;z-index:3;padding:14px 14px 12px;border-bottom:1px solid transparent}
.panel:not([data-view="home"]) .panel-head{border-bottom-color:var(--line)}
.panel[data-view="route"] .panel-head{display:none}
.brand{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.brand svg{width:30px;height:30px;flex:none}
.brand-name{font-weight:760;font-size:19px;letter-spacing:-.02em}
.brand-city{margin-left:auto;font-size:13px;color:var(--text-2);background:var(--surface-2);padding:4px 10px;border-radius:999px}
.search{position:relative}
.field{position:relative;display:flex;align-items:center;gap:8px;height:46px;padding:0 5px 0 13px;background:var(--surface-2);border-radius:12px;border:1.5px solid transparent;transition:border-color .15s,background-color .15s}
.field:focus-within{border-color:var(--brand);background:var(--surface)}
.field>.i{color:var(--text-3)}
.field input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:var(--text);padding:0}
.field input::placeholder{color:var(--text-3)}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.field-btn{width:34px;height:34px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;color:var(--text-3);cursor:pointer;flex:none}
.field-btn:hover{background:var(--hover);color:var(--text)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface-3);border-top-color:var(--brand);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s}
.chip .i{width:17px;height:17px;color:var(--c)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed="true"] .i{color:#fff}
.panel-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-radius:0 0 var(--r) var(--r)}
.view{padding:4px 14px 16px}
.view-bar{display:flex;align-items:center;gap:8px;min-height:50px}
.view-bar h2{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-label{color:var(--text-2);font-size:14px;flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:0;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{text-decoration:none;filter:brightness(1.04)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-soft{background:var(--surface-2);color:var(--text)}
.btn-block{width:100%}
.note{color:var(--text-3);font-size:13px;margin:12px 2px 0}

/* ---------- Главная ---------- */
.home h2{font-size:18px;margin:10px 2px 4px;letter-spacing:-.01em}
.home .lead{margin:0 2px 14px;color:var(--text-2);font-size:14px}
.tips{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.tips li{display:flex;gap:12px;align-items:flex-start;color:var(--text-2);font-size:14px}
.tips .i{color:var(--brand);margin-top:1px;width:18px;height:18px}
.tips b{color:var(--text);font-weight:600}

/* ---------- Подсказки поиска ---------- */
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);max-height:min(440px,62vh);overflow-y:auto;padding:6px;z-index:6}
.sg{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer}
.sg[aria-selected="true"],.sg:hover{background:var(--hover)}
.sg-ico{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;flex:none}
.sg-ico .i{width:18px;height:18px}
.sg-ico.cat{background:var(--c);color:#fff}
.sg-text{min-width:0;flex:1}
.sg-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-title mark{background:transparent;color:inherit;font-weight:700}
.sg-sub{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-tag{font-size:12px;color:var(--brand);background:var(--brand-soft);padding:3px 8px;border-radius:999px;flex:none}
.sg-msg{padding:12px 10px;color:var(--text-2);font-size:14px;display:flex;gap:10px;align-items:center}
.sg-msg .i{color:var(--text-3)}

/* ---------- Список рубрики ---------- */
.kind-ico{width:30px;height:30px;border-radius:50%;background:var(--c,var(--brand));color:#fff;display:grid;place-items:center;flex:none}
.kind-ico .i{width:17px;height:17px}
.res-meta{color:var(--text-2);font-size:13.5px;margin:-2px 2px 10px}
.res-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.toggle{height:32px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.toggle .i{width:16px;height:16px}
.toggle[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.toggle:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{height:26px;padding:0 10px;border:0;border-radius:999px;background:transparent;font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.res-list{display:flex;flex-direction:column;margin:0 -8px}
.res-item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 8px;border:0;background:transparent;border-radius:12px;cursor:pointer}
.res-item:hover,.res-item.hover{background:var(--hover)}
.res-item .kind-ico{width:34px;height:34px;margin-top:1px}
.ri-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ri-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{color:var(--text-2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-dist{font-size:13px;color:var(--text-3);flex:none;padding-top:2px;white-space:nowrap}
.st{font-size:13.5px}
.st-open{color:var(--ok)}.st-closing{color:var(--warn)}.st-closed{color:var(--bad)}.st-unknown,.st-raw,.st-none{color:var(--text-3)}
.empty{text-align:center;padding:26px 12px 18px;color:var(--text-2)}
.empty .i{width:36px;height:36px;margin:0 auto 10px;color:var(--text-3);stroke-width:1.6}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--text)}
.empty p{margin:0 0 14px;font-size:14px}
.empty.err .i{color:var(--bad)}

/* ---------- Карточка объекта ---------- */
.place-kind{display:flex;align-items:center;gap:9px;color:var(--text-2);font-size:14px}
.place-kind .kind-ico{width:28px;height:28px}
.place-title{font-size:22px;line-height:1.22;margin:10px 0 6px;font-weight:760;letter-spacing:-.015em;overflow-wrap:anywhere}
.place-status{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px}
.place-status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.place-status.st-raw::before,.place-status.st-unknown::before{display:none}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;min-height:64px;border-radius:12px;border:0;background:var(--surface-2);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text);text-align:center;line-height:1.15}
.act:hover{text-decoration:none;background:var(--surface-3)}
.act.primary{background:var(--brand);color:var(--brand-ink)}
.act.primary:hover{filter:brightness(1.06);background:var(--brand)}
.facts{list-style:none;padding:0;margin:10px 0 0}
.facts li{display:flex;gap:14px;padding:12px 2px;border-top:1px solid var(--line);font-size:14.5px;overflow-wrap:anywhere}
.facts li>.i{color:var(--text-3);margin-top:1px;width:19px;height:19px}
.facts small{display:block;color:var(--text-3);font-size:13px;margin-top:1px}
.facts .muted{color:var(--text-3)}
.sched{display:grid;gap:2px}
.coords{font-variant-numeric:tabular-nums;color:var(--text-2)}

/* ---------- Маршрут ---------- */
.route-top .view-bar h2{flex:none}
.route-sum{flex:1;min-width:0;color:var(--brand);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.rp{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.badge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.badge-a{background:var(--a)}.badge-b{background:var(--b)}
.rp .search{flex:1;min-width:0}
.rp .field{height:44px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin:12px 0 14px}
.modes button{height:38px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;color:var(--text-2);cursor:pointer}
.modes button .i{width:19px;height:19px}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
.alts{display:grid;gap:8px}
.alt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.alt:hover{background:var(--hover)}
.alt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.alt-main{font-size:18px;font-weight:750;letter-spacing:-.01em}
.alt-main span{font-weight:500;color:var(--text-2);font-size:15px}
.alt-eta{color:var(--text-2);font-size:13px}
.alt-tag{grid-row:1/3;grid-column:2;font-size:12px;color:var(--text-2);background:var(--surface-2);padding:3px 8px;border-radius:999px}
.alt[aria-pressed="true"] .alt-tag{background:var(--surface);color:var(--brand)}
.steps-h{margin:18px 2px 4px;font-size:14px;color:var(--text-2);font-weight:600}
.steps{list-style:none;margin:0 -8px;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:9px 8px;border:0;background:transparent;border-radius:10px;cursor:pointer}
.step:hover,.step.on{background:var(--hover)}
.step-ico{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text)}
.step-ico .i{width:18px;height:18px}
.step-txt{flex:1;min-width:0;padding-top:5px;font-size:14.5px}
.step-dist{color:var(--text-3);font-size:13px;flex:none;padding-top:6px;white-space:nowrap}

/* ---------- Скелетоны ---------- */
.sk{display:block;background:linear-gradient(90deg,var(--skel) 25%,var(--skel-hi) 37%,var(--skel) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-row{display:flex;gap:12px;padding:10px 0}
.sk-circle{width:34px;height:34px;border-radius:50%;flex:none}
.sk-lines{flex:1;display:grid;gap:7px;padding-top:2px}
.sk-line{height:12px}

/* ---------- Кнопки карты ---------- */
.ctrls{position:absolute;z-index:5;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.ctrl-group{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
.ctrl-group .ctrl+.ctrl{border-top:1px solid var(--line)}
.ctrl{width:44px;height:44px;display:grid;place-items:center;border:0;background:var(--surface);color:var(--text);cursor:pointer;padding:0}
.ctrl:hover{background:var(--surface-2)}
.ctrl.solo{border-radius:12px;box-shadow:var(--shadow-sm)}
.ctrl[aria-pressed="true"]{color:var(--brand)}
.ctrl .txt{font-weight:800;font-size:13px;letter-spacing:.02em}
.ctrl.busy .i{animation:spin 1s linear infinite}
.search-area{position:absolute;z-index:6;top:16px;left:calc(50% + (var(--panel-w) + 12px) / 2);transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:999px;border:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;animation:pop .2s ease-out}
.search-area .i{color:var(--brand);width:18px;height:18px}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-6px)}}

/* ---------- Маркеры ---------- */
.pin{width:36px;height:46px;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28))}
.pin svg{display:block;width:36px;height:46px}
.ab{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35);cursor:grab;touch-action:none}
.ab:active{cursor:grabbing}
.ab-a{background:var(--a)}.ab-b{background:var(--b)}
.me{width:20px;height:20px;border-radius:50%;background:#2F80ED;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,128,237,.45);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(47,128,237,0)}100%{box-shadow:0 0 0 0 rgba(47,128,237,0)}}

/* ---------- Контекстное меню ---------- */
.ctx{position:absolute;z-index:20;min-width:210px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px}
.ctx button{display:flex;gap:11px;align-items:center;width:100%;padding:10px 10px;border:0;background:none;border-radius:9px;cursor:pointer;text-align:left;font-size:14.5px}
.ctx button:hover,.ctx button:focus-visible{background:var(--hover)}
.ctx .badge{width:22px;height:22px;font-size:11.5px}
.ctx .i{width:22px;height:20px;color:var(--text-2)}
.ctx-coords{padding:6px 10px 4px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;border-top:1px solid var(--line);margin-top:4px}

/* ---------- Тосты ---------- */
.toasts{position:absolute;z-index:30;left:calc(50% + (var(--panel-w) + 12px) / 2);bottom:40px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - var(--panel-w) - 120px));min-width:260px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-radius:12px;background:#1F2933;color:#fff;box-shadow:var(--shadow);font-size:14px;pointer-events:auto;animation:toastIn .2s ease-out}
:root[data-theme="dark"] .toast{background:#E9EDF1;color:#111827}
.toast .i{width:18px;height:18px;flex:none}
.toast-error .i{color:#FF8A8A}
:root[data-theme="dark"] .toast-error .i{color:#CF3A3A}
.toast span{flex:1}
.toast button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;flex:none}
:root[data-theme="dark"] .toast button{background:rgba(0,0,0,.08)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}

/* ---------- Атрибуция ---------- */
.attrib{position:absolute;z-index:4;right:0;bottom:0;max-width:calc(100% - var(--panel-w) - 40px);padding:3px 9px;font-size:11.5px;line-height:1.4;color:var(--text-2);background:var(--attrib-bg);border-top-left-radius:9px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.attrib a{color:inherit;text-decoration:underline;text-decoration-color:var(--text-3);text-underline-offset:2px}

.fatal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:var(--surface);text-align:center}
.fatal div{max-width:420px}
.fatal h1{font-size:20px;margin:0 0 8px}
.fatal p{color:var(--text-2);margin:0}

/* ---------- Телефон: нижняя шторка ---------- */
@media (max-width:768px){

  if (min < 60) return `${min} мин`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h} ч ${String(m).padStart(2, '0')} мин` : `${h} ч`;
}
function fmtCoord(lat, lon) { return `${lat.toFixed(5)}, ${lon.toFixed(5)}`; }
/** «Настенные часы» Астаны: Date, у которого локальные поля равны времени в городе. */
function cityNow() {
  const d = new Date();
  return new Date(d.getTime() + (d.getTimezoneOffset() + CITY.utcOffsetMin) * 60000);
}
function hhmm(d) { return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
function dayDiff(a, b) {
  const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((db - da) / 86400000);
}
function loadScript([src, integrity]) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = false; s.crossOrigin = 'anonymous'; s.integrity = integrity;
    s.onload = resolve; s.onerror = () => reject(new Error('script ' + src));
    document.head.appendChild(s);
  });
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* приватный режим */ } }

/* =====================================================================
   5. СЛОЙ API: очередь с ограничением частоты + кэш в памяти
   ===================================================================== */
class ApiError extends Error {
  constructor(service, kind, status = 0, detail = '') {
    super(`${service}: ${kind}${status ? ' ' + status : ''}`);
    this.service = service; this.kind = kind; this.status = status; this.detail = detail;
  }
}
const abortError = () => new DOMException('Запрос отменён', 'AbortError');
const isAbort = (e) => !!e && e.name === 'AbortError';

/** Очередь: задачи сервиса стартуют по одной и не чаще, чем раз в interval мс. */
class RateQueue {
  constructor(interval) { this.interval = interval; this.items = []; this.busy = false; this.lastStart = 0; this.timer = null; }
  push(task, signal) {
    return new Promise((resolve, reject) => {
      if (signal && signal.aborted) { reject(abortError()); return; }
      const item = { task, resolve, reject, signal };
      if (signal) {
        item.onAbort = () => {
          const i = this.items.indexOf(item);
          if (i >= 0) { this.items.splice(i, 1); reject(abortError()); }
        };
        signal.addEventListener('abort', item.onAbort, { once: true });
      }
      this.items.push(item);
      this.pump();
    });
  }
  pump() {
    if (this.busy || this.timer || !this.items.length) return;
    const wait = this.lastStart + this.interval - Date.now();
    if (wait > 0) { this.timer = setTimeout(() => { this.timer = null; this.pump(); }, wait); return; }
    const item = this.items.shift();
    if (item.signal) item.signal.removeEventListener('abort', item.onAbort);
    this.busy = true;
    this.lastStart = Date.now();
    Promise.resolve().then(item.task).then(item.resolve, item.reject).finally(() => { this.busy = false; this.pump(); });
  }
}

function sleepFor(ms, signal) {
  return new Promise((resolve, reject) => {
    if (signal && signal.aborted) { reject(abortError()); return; }
    const t = setTimeout(() => { if (signal) signal.removeEventListener('abort', onAbort); resolve(); }, ms);
    const onAbort = () => { clearTimeout(t); reject(abortError()); };
    if (signal) signal.addEventListener('abort', onAbort, { once: true });
  });
}

/** Сутки храним последние ответы Overpass в localStorage: повторный показ не зависит от перегрузки серверов. */
const OverpassStore = {
  KEY: 'korset.overpass.v1', TTL: 86400000, MAX: 16,
  read() { try { return JSON.parse(lsGet(this.KEY) || '[]'); } catch (e) { return []; } },
  get(ql) {
    const hit = this.read().find(x => x.q === ql);
    return hit && Date.now() - hit.t < this.TTL ? hit.j : null;
  },
  set(ql, json) {
    const list = this.read().filter(x => x.q !== ql && Date.now() - x.t < this.TTL);
    list.unshift({ q: ql, t: Date.now(), j: { elements: json.elements || [] } });
    lsSet(this.KEY, JSON.stringify(list.slice(0, this.MAX)));
  }
};

/** Простой LRU-кэш ответов (только успешных). */
class Cache {
  constructor(max) { this.max = max; this.m = new Map(); }
  get(k) { if (!this.m.has(k)) return undefined; const v = this.m.get(k); this.m.delete(k); this.m.set(k, v); return v; }
  set(k, v) { this.m.delete(k); this.m.set(k, v); if (this.m.size > this.max) this.m.delete(this.m.keys().next().value); }
}

async function fetchJSON(service, url, { method = 'GET', body, signal, timeout = 15000 } = {}) {
  const ctrl = new AbortController();
  let timedOut = false;
  const onAbort = () => ctrl.abort();
  if (signal) {
    if (signal.aborted) throw abortError();
    signal.addEventListener('abort', onAbort, { once: true });
  }
  const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, timeout);
  const fail = (kind) => {
    if (timedOut) return new ApiError(service, 'timeout');
    if (signal && signal.aborted) return abortError();
    return new ApiError(service, navigator.onLine === false ? 'offline' : kind);
  };
  try {
    let res;
    try { res = await fetch(url, { method, body, signal: ctrl.signal }); }
    catch (e) { throw fail('network'); }
    if (!res.ok) {
      let detail = '';
      try { detail = await res.text(); } catch (e) { /* тело недоступно */ }
      throw new ApiError(service, 'http', res.status, detail.slice(0, 400));
    }
    try { return await res.json(); }
    catch (e) { throw fail('parse'); }
  } finally {
    clearTimeout(timer);
    if (signal) signal.removeEventListener('abort', onAbort);
  }
}

const Api = {
  cache: new Cache(400),
  queues: {
    photon: new RateQueue(300),      // + debounce 300 мс и отмена в поле ввода
    nominatim: new RateQueue(1100),  // политика Nominatim: не чаще 1 запроса в секунду
    osrm: new RateQueue(1100),       // FOSSGIS: не чаще 1 запроса в секунду (с запасом)
    overpass: new RateQueue(1000)    // по одному запросу за раз
  },
  overpassOrder: (() => {
    // Сервер, который недавно ответил, пробуем первым (помним час).
    try {
      const s = JSON.parse(lsGet('korset.overpass.order') || 'null');
      if (s && Date.now() - s.t < 3600000 && ENDPOINTS.overpass.includes(s.first)) {
        return [s.first, ...ENDPOINTS.overpass.filter(u => u !== s.first)];
      }
    } catch (e) { /* нет сохранённого порядка */ }
    return ENDPOINTS.overpass.slice();
  })(),

  async cached(key, run) {
    const hit = this.cache.get(key);
    if (hit !== undefined) return hit;
    const value = await run();
    this.cache.set(key, value);
    return value;
  },

  photon(q, signal) {
    const p = new URLSearchParams({ q, lat: CITY.center.lat, lon: CITY.center.lon, limit: 8, bbox: City.searchBbox().join(','), lang: 'default' });
    const url = `${ENDPOINTS.photon}?${p}`;
    return this.cached(url, () => this.queues.photon.push(() => fetchJSON('photon', url, { signal, timeout: 10000 }), signal));
  },

  reverse(lat, lon, signal) {
    const p = new URLSearchParams({
      format: 'jsonv2', lat: lat.toFixed(6), lon: lon.toFixed(6), 'accept-language': 'ru',
      zoom: 18, addressdetails: 1, extratags: 1, namedetails: 1
    });
    const url = `${ENDPOINTS.nominatim}/reverse?${p}`;
    return this.cached(url, () => this.queues.nominatim.push(() => fetchJSON('nominatim', url, { signal, timeout: 12000 }), signal));
  },

  geocodeCity() {
    const p = new URLSearchParams({ format: 'jsonv2', q: CITY.geocodeQuery, limit: 1, 'accept-language': 'ru', countrycodes: CITY.countryCode });
    const url = `${ENDPOINTS.nominatim}/search?${p}`;
    return this.cached(url, () => this.queues.nominatim.push(() => fetchJSON('nominatim', url, { timeout: 12000 })));
  },

  /**
   * Overpass: основной сервер, при 429/5xx — запасной, затем повторы с экспоненциальной паузой
   * (так просит сам overpass-api.de, когда перегружен). Сервер, не ответивший за таймаут,
   * в этом запросе больше не опрашивается. Успешный сервер становится первым.
   * Успешные ответы дополнительно живут сутки в localStorage — страховка для показа.
   */
  overpassDownUntil: 0,
  overpass(ql, signal, onRetry) {
    const stored = OverpassStore.get(ql);
    if (stored) return Promise.resolve(stored);
    // Только что не дождались ни одного сервера — пару минут не ждём их снова, сразу идём в резерв.
    if (Date.now() < this.overpassDownUntil) return Promise.reject(new ApiError('overpass', 'down'));
    return this.cached('ovp:' + ql, () => this.queues.overpass.push(async () => {
      const started = Date.now(), BUDGET = 20000;
      const dead = new Set();
      let lastErr = null;
      for (let attempt = 0; ; attempt++) {
        const alive = this.overpassOrder.filter(s => !dead.has(s));
        const left = BUDGET - (Date.now() - started);
        if (!alive.length || left < 4000) break;
        if (attempt >= alive.length) await sleepFor(Math.min(1500 * 2 ** (attempt - alive.length), 8000), signal);
        const server = alive[attempt % alive.length];
        if (attempt > 0 && onRetry) onRetry(attempt + 1);
        try {
          const json = await fetchJSON('overpass', server, {
            method: 'POST', body: new URLSearchParams({ data: ql }), signal,
            // здоровый сервер отвечает на городской запрос за 1–3 с; дольше — переходим к следующему
            timeout: Math.min(attempt < alive.length ? 10000 : 20000, BUDGET - (Date.now() - started))
          });
          if (json.remark && /runtime error|timed out|out of memory/i.test(json.remark) && !(json.elements || []).length) {
            throw new ApiError('overpass', 'remark', 0, json.remark);
          }
          if (server !== this.overpassOrder[0]) this.overpassOrder = [server, ...this.overpassOrder.filter(s => s !== server)];
          lsSet('korset.overpass.order', JSON.stringify({ first: server, t: Date.now() }));
          OverpassStore.set(ql, json);
          this.overpassDownUntil = 0;
          return json;
        } catch (e) {
          if (isAbort(e)) throw e;
          lastErr = e;
          if (e.kind === 'http' && e.status === 400) throw e; // ошибка в запросе — другой сервер не поможет
          if (e.kind === 'timeout' || e.kind === 'network') dead.add(server);
        }
      }
      this.overpassDownUntil = Date.now() + 120000;
      throw lastErr || new ApiError('overpass', 'timeout');
    }, signal));
  },

  photonCategory(include, [w, s, e, n], signal) {
    const p = new URLSearchParams({ include, bbox: [w, s, e, n].join(','), lat: ((s + n) / 2).toFixed(5), lon: ((w + e) / 2).toFixed(5), limit: 50, lang: 'default' });
    const url = `${ENDPOINTS.photon}?${p}`;
    return this.cached(url, () => this.queues.photon.push(() => fetchJSON('photon', url, { signal, timeout: 12000 }), signal));
  },

  async overpassById(type, id, signal) {
    const t = { node: 'node', way: 'way', relation: 'rel' }[type];
    if (!t) return null;
    const json = await this.overpass(`[out:json][timeout:25];${t}(${Number(id)});out tags center 1;`, signal);
    return (json.elements || [])[0] || null;
  },

  route(mode, a, b, signal) {
    const c = (p) => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`;
    // Вид транспорта задаётся префиксом routed-*; сегмент «driving» FOSSGIS игнорирует.
    const url = `${ENDPOINTS.osrm}/routed-${mode}/route/v1/driving/${c(a)};${c(b)}?overview=full&geometries=geojson&steps=true&alternatives=true`;
    return this.cached(url, () => this.queues.osrm.push(() => fetchJSON('osrm', url, { signal, timeout: 15000 }), signal));
  }
};

function errMessage(e, service) {
  if (e && e.kind === 'offline') return 'Нет подключения к интернету. Проверьте сеть и попробуйте снова.';
  switch (service) {
    case 'overpass': return 'Справочник организаций сейчас перегружен. Попробуйте через минуту.';
    case 'osrm':
      if (e && e.kind === 'noroute') return 'Не удалось проложить маршрут между этими точками. Поставьте точки ближе к дорогам.';
      if (e && e.kind === 'http' && e.status === 400) return 'Не удалось найти дорогу рядом с точкой. Сдвиньте её ближе к улице.';
      return 'Сервис маршрутов временно недоступен, попробуйте через минуту.';
    case 'photon': return 'Поиск временно недоступен. Попробуйте ещё раз через минуту.';
    case 'nominatim': return 'Не удалось определить адрес: сервис геокодирования недоступен.';
    default: return 'Что-то пошло не так. Попробуйте ещё раз.';
  }
}

/* =====================================================================
   6. ГОРОД
   ===================================================================== */
const City = {
  async init() {
    const saved = lsGet('korset.city.v1');
    if (saved) {
      try {
        const j = JSON.parse(saved);
        if (j && Array.isArray(j.bbox) && Date.now() - j.t < 30 * 86400000) { CITY.bbox = j.bbox; return; }
      } catch (e) { /* испорченный кэш — перезапросим */ }
    }
    try {
      const res = await Api.geocodeCity();
      const r = res && res[0];
      if (r && r.boundingbox) {
        const [s, n, w, e] = r.boundingbox.map(Number);
        if ([s, n, w, e].every(Number.isFinite)) {
          CITY.bbox = [w, s, e, n];
          lsSet('korset.city.v1', JSON.stringify({ bbox: CITY.bbox, t: Date.now() }));
        }
      }
    } catch (e) { /* остаёмся на встроенных границах города */ }
  },
  searchBbox() {
    const [w, s, e, n] = CITY.bbox, pad = 0.05;
    return [w - pad, s - pad, e + pad, n + pad].map(v => +v.toFixed(4));
  },
  near(p, km = CITY.radiusKm) { return !!p && haversine(CITY.center, p) <= km * 1000; }
};

/* =====================================================================
   7. ЧАСЫ РАБОТЫ (opening_hours)
   ===================================================================== */
const Hours = {
  ready: false, failed: false,
  parsed: new Map(),
  load() {
    return loadScript(LIBS.suncalc)
      .then(() => loadScript(LIBS.openingHours))
      .then(() => { this.ready = typeof window.opening_hours === 'function'; this.failed = !this.ready; })
      .catch(() => { this.failed = true; });
  },
  get(value) {
    if (!this.ready) return null;
    if (this.parsed.has(value)) return this.parsed.get(value);
    let oh = null;
    try {
      oh = new window.opening_hours(value,
        { lat: CITY.center.lat, lon: CITY.center.lon, address: { country_code: CITY.countryCode, state: '' } },
        { mode: 0 });
    } catch (e) { oh = null; }
    this.parsed.set(value, oh);
    return oh;
  },
  /** { kind: open|closing|closed|unknown|raw|none, text, open } */
  status(value) {
    if (!value) return { kind: 'none', text: '', open: null };
    const oh = this.get(value);
    if (!oh) return { kind: 'raw', text: value, open: null };
    try {
      const now = cityNow();
      if (oh.getUnknown(now)) {
        const c = oh.getComment(now);
        return { kind: 'unknown', text: c ? `Уточняйте: ${c}` : 'Режим работы уточняйте', open: null };
      }
      const open = oh.getState(now);
      const next = oh.getNextChange(now);
      if (open) {
        if (!next) return { kind: 'open', text: 'Открыто круглосуточно', open: true };
        const mins = (next - now) / 60000;
        if (mins <= 60) return { kind: 'closing', text: `Закроется через ${Math.max(1, Math.round(mins))} мин`, open: true };
        const dd = dayDiff(now, next);
        const until = dd === 0 || (dd === 1 && next.getHours() < 6) ? hhmm(next) : `${WEEKDAYS_SHORT[next.getDay()]} ${hhmm(next)}`;
        return { kind: 'open', text: `Открыто до ${until}`, open: true };
      }
      if (!next) return { kind: 'closed', text: 'Закрыто', open: false };
      const dd = dayDiff(now, next);
      const when = dd === 0 ? `в ${hhmm(next)}` : dd === 1 ? `завтра в ${hhmm(next)}` : `${WEEKDAYS_IN[next.getDay()]} в ${hhmm(next)}`;
      return { kind: 'closed', text: `Закрыто, откроется ${when}`, open: false };
    } catch (e) {
      return { kind: 'raw', text: value, open: null };
    }
  },
  isOpen(value) { return this.status(value).open === true; },
  pretty(value) {
    const v = String(value).trim();
    if (v === '24/7') return ['Круглосуточно'];
    const map = { Mo: 'Пн', Tu: 'Вт', We: 'Ср', Th: 'Чт', Fr: 'Пт', Sa: 'Сб', Su: 'Вс', PH: 'праздники', SH: 'каникулы', off: 'выходной', closed: 'выходной' };
    return v.split(/\s*;\s*/).filter(Boolean).map(rule => rule
      .replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH|SH|off|closed)\b/g, m => map[m])
      .replace(/24\/7/g, 'круглосуточно')
      .replace(/,(?=\S)/g, ', ')
      .replace(/(\d)-(\d)/g, '$1–$2')
      .replace(/([А-Яа-я])-([А-Яа-я])/g, '$1–$2'));
  }
};

/* =====================================================================
   8. ОБЪЕКТЫ OSM: типы, названия, адреса
   ===================================================================== */
function primaryTag(tags) {
  for (const k of KEY_ORDER) if (tags[k]) return [k, tags[k]];
  return [null, null];
}
function typeLabel(tags) {
  const [k, v] = primaryTag(tags || {});
  if (!k) return 'Объект';
  return TYPE_RU[`${k}=${v}`] || TYPE_RU[`${k}=*`] || 'Объект';
}
function catOfTags(tags) {
  for (const k of ['amenity', 'shop']) {
    const id = tags && tags[k] && CAT_BY_TAG[`${k}=${tags[k]}`];
    if (id) return id;
  }
  return null;
}
function addrFromTags(t) {
  const street = t['addr:street'] || t['addr:place'];
  const h = t['addr:housenumber'];
  if (street && h) return `${street}, ${h}`;
  if (street) return street;
  if (h) return `д. ${h}`;
  return null;
}
function kindFromTags(t) {
  const [k] = primaryTag(t);
  if (k && ORG_KEYS.has(k)) return 'org';
  if (k === 'highway') return t.highway === 'bus_stop' ? 'org' : 'street';
  if (k === 'place' || k === 'boundary') return 'district';
  if (k === 'building') return 'house';
  return 'org';
}
const KIND_ICON = { org: 'store', street: 'road', house: 'building', district: 'layers', point: 'pin' };

function placeTitle(p) {
  const t = p.tags || {};
  return t['name:ru'] || t.name || p.name || (p.kind !== 'org' && p.address) || typeLabel(t) || 'Точка на карте';
}
function placeType(p) {
  if (p.typeLabel) return p.typeLabel;
  if (p.kind === 'street') return 'Улица';
  if (p.kind === 'district') return typeLabel(p.tags) === 'Объект' ? 'Район' : typeLabel(p.tags);
  return typeLabel(p.tags);
}

function placeFromElement(el, catId) {
  const lat = el.lat != null ? el.lat : el.center && el.center.lat;
  const lon = el.lon != null ? el.lon : el.center && el.center.lon;
  if (lat == null || lon == null) return null;
  const tags = el.tags || {};
  const kind = kindFromTags(tags);
  return {
    key: `${el.type}/${el.id}`, kind, osmType: el.type, osmId: el.id, lat, lon, tags,
    catId: catId || catOfTags(tags), address: addrFromTags(tags), area: tags['addr:suburb'] || tags['addr:district'] || null,
    source: 'overpass'
  };
}

function photonKind(p) {
  if (p.osm_key === 'highway' && p.osm_value !== 'bus_stop') return 'street';
  if (p.type === 'street') return 'street';
  if (ORG_KEYS.has(p.osm_key) || p.osm_key === 'highway') return 'org';
  if (p.osm_key === 'place' || p.osm_key === 'boundary' || ['district', 'locality', 'city', 'county', 'state', 'suburb'].includes(p.type)) return 'district';
  return 'house';
}
function placeFromPhoton(f) {
  const p = f.properties || {};
  const [lon, lat] = f.geometry.coordinates;
  const kind = photonKind(p);
  const osmType = { N: 'node', W: 'way', R: 'relation' }[p.osm_type];
  const tags = {};
  if (p.name) tags.name = p.name;
  if (p.osm_key) tags[p.osm_key] = p.osm_value;
  if (p.street) tags['addr:street'] = p.street;
  if (p.housenumber) tags['addr:housenumber'] = p.housenumber;
  const addr = addrFromTags(tags);
  return {
    key: `${osmType}/${p.osm_id}`, kind, osmType, osmId: p.osm_id, lat, lon, tags,
    name: p.name || addr || null,
    catId: catOfTags(tags),
    address: kind === 'street' || kind === 'district' ? null : addr,
    area: [p.district, p.city].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(', ') || null,
    extent: Array.isArray(p.extent) ? p.extent : null,
    needsDetails: kind === 'org' && !!osmType,
    source: 'photon'
  };
}
function placeFromNominatim(r, lat, lon) {
  const a = r.address || {};
  const nd = r.namedetails || {};
  const name = nd['name:ru'] || r.name || nd.name || '';
  const tags = Object.assign({}, r.extratags || {});
  if (name) tags.name = name;
  if (r.category && r.type) tags[r.category] = r.type;
  const road = a.road || a.pedestrian || a.footway || a.residential || a.square || a.path || '';
  const address = road ? (a.house_number ? `${road}, ${a.house_number}` : road) : (a.house_number ? `д. ${a.house_number}` : null);
  const area = [a.suburb || a.quarter || a.neighbourhood, a.city_district].filter(Boolean)
    .filter((v, i, arr) => arr.indexOf(v) === i).join(', ') || a.city || a.town || null;
  const isOrg = !!name && ORG_KEYS.has(r.category);
  return {
    key: `pt/${lat.toFixed(5)},${lon.toFixed(5)}`,
    kind: isOrg ? 'org' : 'point',
    lat, lon,
    tags: isOrg ? tags : (name ? { name } : {}),
    osmType: r.osm_type || null, osmId: r.osm_id || null,
    address, area,
    catId: isOrg ? catOfTags(tags) : null,
    typeLabel: isOrg ? null : (r.category === 'building' || a.house_number ? 'Здание' : 'Адрес'),
    source: 'nominatim', addressTried: true
  };
}
function osmUrl(p) {
  if (p.osmType && p.osmId) return `https://www.openstreetmap.org/${p.osmType}/${p.osmId}`;
  return `https://www.openstreetmap.org/?mlat=${p.lat.toFixed(6)}&mlon=${p.lon.toFixed(6)}#map=18/${p.lat.toFixed(6)}/${p.lon.toFixed(6)}`;
}

/* =====================================================================
   9. КАРТА: стиль, свои слои, маркеры
   ===================================================================== */
const M = {
  data: { poi: FC(), hl: FC(), route: FC(), step: FC() },
  images: {},
  markers: { sel: null, a: null, b: null, user: null },
  styleCache: {},
  styleReady: false,

  buildImages() {
    for (const c of CATEGORIES) {
      this.images[`k-cat-${c.id}`] = drawMarker(c.color, c.icon, 30, false);
      this.images[`k-cat-${c.id}-hl`] = drawMarker(c.color, c.icon, 48, true);
    }
  },

  init(cam, style) {
    this.buildImages();
    map = new maplibregl.Map({
      container: 'map',
      style,
      center: [cam.lon, cam.lat], zoom: cam.zoom, bearing: cam.bearing || 0, pitch: cam.pitch || 0,
      maxPitch: 70,
      attributionControl: false,
      fadeDuration: 150,
      dragRotate: true,
      touchPitch: true
    });
    map.on('error', (e) => {
      const msg = (e && e.error && e.error.message) || '';
      if (!this.styleReady && /style/i.test(msg)) showFatal('Не удалось загрузить карту', 'Сервер тайлов OpenFreeMap сейчас недоступен. Обновите страницу через минуту.');
      // ошибки отдельных тайлов не мешают работе — молча пропускаем
    });
    map.on('styleimagemissing', (e) => {
      if (map.hasImage(e.id)) return;
      if (this.images[e.id]) map.addImage(e.id, this.images[e.id], { pixelRatio: 2 });
      else map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
    });
    map.on('style.load', () => this.onStyle());
  },

  onStyle() {
    for (const [id, img] of Object.entries(this.images)) if (!map.hasImage(id)) map.addImage(id, img, { pixelRatio: 2 });
    const dark = S.theme === 'dark';
    const add = (id, src) => { if (!map.getSource(id)) map.addSource(id, src); };
    add('k-route', { type: 'geojson', data: this.data.route });
    add('k-step', { type: 'geojson', data: this.data.step });
    add('k-poi', { type: 'geojson', data: this.data.poi, cluster: true, clusterRadius: 44, clusterMaxZoom: 15 });
    add('k-hl', { type: 'geojson', data: this.data.hl });

    const lineW = (a, b) => ['interpolate', ['linear'], ['zoom'], 10, a, 16, b];
    const layers = [
      { id: 'k-route-alt', type: 'line', source: 'k-route', filter: ['==', ['get', 'primary'], false],
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': dark ? '#6B7480' : '#9AA4B0', 'line-width': lineW(4, 8), 'line-opacity': 0.95 } },
      { id: 'k-route-casing', type: 'line', source: 'k-route', filter: ['==', ['get', 'primary'], true],
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': dark ? '#0B1418' : '#FFFFFF', 'line-width': lineW(8, 14) } },
      { id: 'k-route-main', type: 'line', source: 'k-route',
        filter: ['all', ['==', ['get', 'primary'], true], ['!=', ['get', 'mode'], 'foot']],
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': dark ? '#3BB4DA' : '#0A7EA4', 'line-width': lineW(5, 9) } },
      { id: 'k-route-foot', type: 'line', source: 'k-route',
        filter: ['all', ['==', ['get', 'primary'], true], ['==', ['get', 'mode'], 'foot']],
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': dark ? '#3BB4DA' : '#0A7EA4', 'line-width': lineW(5, 9), 'line-dasharray': [0.1, 1.9] } },
      { id: 'k-step', type: 'circle', source: 'k-step',
        paint: { 'circle-radius': 7, 'circle-color': dark ? '#1B1F25' : '#FFFFFF', 'circle-stroke-width': 3.5, 'circle-stroke-color': dark ? '#3BB4DA' : '#0A7EA4' } },
      { id: 'k-poi-cluster', type: 'circle', source: 'k-poi', filter: ['has', 'point_count'],
        paint: {
          'circle-color': this.catColor(),
          'circle-radius': ['step', ['get', 'point_count'], 16, 10, 19, 50, 23],
          'circle-stroke-width': 3, 'circle-stroke-color': dark ? '#1B1F25' : '#FFFFFF', 'circle-opacity': 0.95
        } },
      { id: 'k-poi-count', type: 'symbol', source: 'k-poi', filter: ['has', 'point_count'],
        layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-allow-overlap': true, 'text-ignore-placement': true },
        paint: { 'text-color': '#FFFFFF' } },
      { id: 'k-poi-icon', type: 'symbol', source: 'k-poi', filter: ['!', ['has', 'point_count']],
        layout: {
          'icon-image': ['get', 'img'], 'icon-allow-overlap': true, 'icon-ignore-placement': true,
          'text-field': ['step', ['zoom'], '', 15, ['get', 'name']], 'text-font': ['Noto Sans Regular'], 'text-size': 12,
          'text-offset': [0, 1.3], 'text-anchor': 'top', 'text-optional': true, 'text-max-width': 9
        },
        paint: { 'text-color': dark ? '#E6EAEE' : '#1F2933', 'text-halo-color': dark ? '#0C0C0C' : '#FFFFFF', 'text-halo-width': 1.5 } },
      { id: 'k-hl', type: 'symbol', source: 'k-hl',
        layout: { 'icon-image': ['get', 'img'], 'icon-allow-overlap': true, 'icon-ignore-placement': true } }
    ];
    for (const l of layers) if (!map.getLayer(l.id)) map.addLayer(l);
    this.styleReady = true;
    if (S.is3D) this.ensure3D();
  },

  catColor() { return S.cat ? CAT_BY_ID[S.cat.id].color : '#0A7EA4'; },

  setSource(id, data) {
    this.data[id] = data;
    const src = map && map.getSource(`k-${id}`);
    if (src) src.setData(data);
  },

  setPoi(items) {
    if (map && map.getLayer('k-poi-cluster')) map.setPaintProperty('k-poi-cluster', 'circle-color', this.catColor());
    this.setSource('poi', FC(items.map(it => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [it.lon, it.lat] },
      properties: { id: it.key, img: `k-cat-${it.catId || (S.cat && S.cat.id)}`, name: placeTitle(it) }
    }))));
  },

  setHighlight(item) {
    this.setSource('hl', FC(item ? [{
      type: 'Feature', geometry: { type: 'Point', coordinates: [item.lon, item.lat] },
