    }] : []));
  },

  setRoute() {
    const r = S.route;
    this.setSource('route', FC(r.routes.map((rt, i) => ({
      type: 'Feature', geometry: rt.geometry, properties: { idx: i, primary: i === r.active, mode: r.mode }
    }))));
  },

  setStep(coord) {
    this.setSource('step', FC(coord ? [{ type: 'Feature', geometry: { type: 'Point', coordinates: coord }, properties: {} }] : []));
  },

  setSelected(place) {
    const m = this.markers;
    if (!place) { if (m.sel) { m.sel.remove(); m.sel = null; } return; }
    if (!m.sel) {
      const el = document.createElement('div');
      el.className = 'pin';
      el.innerHTML = `<svg viewBox="0 0 36 46" aria-hidden="true"><path d="M18 45s15-13.4 15-26.4A15 15 0 0 0 3 18.6C3 31.6 18 45 18 45z" fill="var(--brand)" stroke="#fff" stroke-width="2.5"/><circle cx="18" cy="18.5" r="6" fill="#fff"/></svg>`;
      m.sel = new maplibregl.Marker({ element: el, anchor: 'bottom' });
    }
    m.sel.setLngLat([place.lon, place.lat]).addTo(map);
  },

  setAB() {
    for (const which of ['a', 'b']) {
      const p = S.route[which];
      let mk = this.markers[which];
      if (!p) { if (mk) { mk.remove(); this.markers[which] = null; } continue; }
      if (!mk) {
        const el = document.createElement('div');
        el.className = `ab ab-${which}`;
        el.textContent = which === 'a' ? 'А' : 'Б';
        el.title = 'Перетащите, чтобы изменить точку';
        mk = this.markers[which] = new maplibregl.Marker({ element: el, draggable: true, anchor: 'center' });
        mk.on('dragend', () => {
          const ll = mk.getLngLat();
          Route.setPoint(which, { lat: ll.lat, lon: ll.lng, label: 'Точка на карте' }, { fit: false });
        });
      }
      mk.setLngLat([p.lon, p.lat]).addTo(map);
    }
  },

  setUser(p) {
    if (!this.markers.user) {
      const el = document.createElement('div');
      el.className = 'me';
      el.title = 'Вы здесь';
      this.markers.user = new maplibregl.Marker({ element: el, anchor: 'center' });
    }
    this.markers.user.setLngLat([p.lon, p.lat]).addTo(map);
  },

  ensure3D() {
    const style = map.getStyle();
    const has = style.layers.some(l => l.type === 'fill-extrusion' && l['source-layer'] === 'building' && l.id !== 'k-3d');
    if (has || map.getLayer('k-3d')) return;
    const src = Object.keys(style.sources).find(k => style.sources[k].type === 'vector') || 'openmaptiles';
    const dark = S.theme === 'dark';
    map.addLayer({
      id: 'k-3d', type: 'fill-extrusion', source: src, 'source-layer': 'building', minzoom: 14,
      filter: ['!=', ['get', 'hide_3d'], true],
      paint: {
        'fill-extrusion-color': dark ? '#2B323B' : '#DCD5CB',
        'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 14, 0, 15, ['coalesce', ['get', 'render_height'], 8]],
        'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
        'fill-extrusion-opacity': 0.88
      }
    }, map.getLayer('k-route-alt') ? 'k-route-alt' : undefined);
  },
  remove3D() { if (map.getLayer('k-3d')) map.removeLayer('k-3d'); },

  layersAt(point, ids) {
    const layers = ids.filter(id => map.getLayer(id));
    if (!layers.length) return null;
    const box = Array.isArray(point) ? point : [[point.x - 7, point.y - 7], [point.x + 7, point.y + 7]];
    return map.queryRenderedFeatures(box, { layers })[0] || null;
  },

  /** Смещение камеры, чтобы объект оказался в центре видимой (не закрытой панелью) части карты. */
  offset() {
    if (isMobile()) return [0, -Math.min(Sheet.visible, window.innerHeight * 0.6) / 2];
    return [Math.round(Panel.el.getBoundingClientRect().right / 2), 0];
  },
  padding(extra = 48) {
    if (isMobile()) {
      return { top: 70, left: 28, right: 64, bottom: Math.min(Sheet.visible, window.innerHeight * 0.6) + 24 };
    }
    return { top: extra, bottom: extra, right: 80, left: Panel.el.getBoundingClientRect().right + extra };
  },
  flyToPlace(place, extent) {
    if (extent && extent.length === 4) {
      const [w, n, e, s] = extent;
      if (Math.abs(e - w) > 1e-4 || Math.abs(n - s) > 1e-4) {
        map.fitBounds([[w, s], [e, n]], { padding: this.padding(), maxZoom: 16.5, duration: 1100 });
        return;
      }
    }
    map.flyTo({ center: [place.lon, place.lat], zoom: Math.max(map.getZoom(), 16.2), offset: this.offset(), duration: 1300 });
  },
  fitRoute() {
    const coords = S.route.routes.flatMap(r => r.geometry.coordinates);
    if (!coords.length) return;
    let w = 180, s = 90, e = -180, n = -90;
    for (const [x, y] of coords) { w = Math.min(w, x); e = Math.max(e, x); s = Math.min(s, y); n = Math.max(n, y); }
    map.fitBounds([[w, s], [e, n]], { padding: this.padding(56), maxZoom: 16, duration: 1000 });
  },

  /** Видимая область без панели, ограниченная по размеру — чтобы Overpass не получил полстраны. */
  visibleBbox() {
    const el = map.getContainer();
    const W = el.clientWidth, H = el.clientHeight;
    let x0 = 0, y1 = H;
    if (isMobile()) y1 = Math.max(120, H - Sheet.visible);
    else x0 = clamp(Panel.el.getBoundingClientRect().right + 8, 0, W - 120);
    const pts = [[x0, 0], [W, 0], [W, y1], [x0, y1]].map(p => map.unproject(p));
    let w = Math.min(...pts.map(p => p.lng)), e = Math.max(...pts.map(p => p.lng));
    let s = Math.min(...pts.map(p => p.lat)), n = Math.max(...pts.map(p => p.lat));
    const mid = map.unproject([(x0 + W) / 2, y1 / 2]);
    const maxLon = 0.45, maxLat = 0.28;
    if (e - w > maxLon) { w = Math.max(w, mid.lng - maxLon / 2); e = Math.min(e, mid.lng + maxLon / 2); }
    if (n - s > maxLat) { s = Math.max(s, mid.lat - maxLat / 2); n = Math.min(n, mid.lat + maxLat / 2); }
    return [w, s, e, n].map(v => +v.toFixed(5));
  },
  visibleCenter() {
    const el = map.getContainer();
    const W = el.clientWidth, H = el.clientHeight;
    const x0 = isMobile() ? 0 : Panel.el.getBoundingClientRect().right;
    const y1 = isMobile() ? Math.max(120, H - Sheet.visible) : H;
    const ll = map.unproject([(x0 + W) / 2, y1 / 2]);
    return { lat: ll.lat, lon: ll.lng };
  }
};

/** Маркер рубрики на canvas: цветной круг с белой иконкой (контуры те же, что в SVG). */
function drawMarker(color, iconName, size, ring) {
  const pr = 2, px = size * pr;
  const cv = document.createElement('canvas');
  cv.width = cv.height = px;
  const ctx = cv.getContext('2d');
  ctx.scale(pr, pr);
  const c = size / 2;
  const R = ring ? size * 0.33 : size / 2 - 2.5;
  if (ring) {
    ctx.beginPath(); ctx.arc(c, c, size / 2 - 1, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.globalAlpha = 0.22; ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
  ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(c, c, R - 2.2, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  const iconPx = (R - 2.2) * 1.2, k = iconPx / 24;
  ctx.save();
  ctx.translate(c - iconPx / 2, c - iconPx / 2); ctx.scale(k, k);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const d of ICONS[iconName]) ctx.stroke(new Path2D(d));
  ctx.restore();
  return ctx.getImageData(0, 0, px, px);
}

/* =====================================================================
   10. ПАНЕЛЬ И НИЖНЯЯ ШТОРКА
   ===================================================================== */
const Panel = {
  el: null, body: null,
  stack: ['home'],
  current() { return this.stack[this.stack.length - 1]; },
  show(view) {
    if (view === 'home') this.stack = ['home'];
    else if (this.current() !== view) {
      const i = this.stack.indexOf(view);
      if (i >= 0) this.stack = this.stack.slice(0, i);
      this.stack.push(view);
    }
    this.apply();
  },
  apply() {
    const view = this.current();
    const changed = S.view !== view;
    S.view = view;
    this.el.dataset.view = view;
    for (const sec of $$('.view', this.body)) sec.hidden = sec.dataset.view !== view;
    this.el.classList.toggle('tall', view === 'results' || view === 'route');
    if (changed) this.body.scrollTop = 0;
    if (view === 'place') renderPlace();
    if (isMobile()) {
      const target = view === 'home' ? 'collapsed' : 'half';
      if (changed || Sheet.state === 'collapsed' || view === 'home') Sheet.set(target);
      else Sheet.layout();
    }
  },
  back() {
    const leaving = this.current();
    if (leaving === 'place') Place.close();
    else if (leaving === 'route') Route.clear();
    else if (leaving === 'results') Cat.clear();
    this.stack.pop();
    while (this.stack.length > 1) {
      const v = this.current();
      if ((v === 'results' && !S.cat) || (v === 'route' && !S.route.a && !S.route.b) || (v === 'place' && !S.place)) this.stack.pop();
      else break;
    }
    if (!this.stack.length) this.stack = ['home'];
    this.apply();
    Hash.write();
  }
};

const Sheet = {
  state: 'collapsed', visible: 0, touch: null, mouse: null,
  heights() {
    const H = window.innerHeight;
    const grab = $('#sheetGrab').offsetHeight || 22;
    const peekEl = S.view === 'route' ? $('#routeTop') : $('#panelHead');
    const peek = Math.round(grab + (peekEl ? peekEl.offsetHeight : 120) + (S.view === 'route' ? 2 : 0));
    const full = Math.max(peek + 120, H - 58);
    const half = clamp(Math.round(H * 0.5), peek + 80, full - 60);
    return { collapsed: Math.min(peek, full), half, full };
  },
  apply(vis, animate) {
    const h = this.heights();
    this.visible = clamp(vis, h.collapsed, h.full);
    Panel.el.style.height = `${h.full}px`;
    Panel.el.classList.toggle('dragging', !animate);
    Panel.el.style.transform = `translateY(${h.full - this.visible}px)`;
  },
  set(state) {
    this.state = state;
    if (!isMobile()) return;
    const h = this.heights();
    this.apply(h[state], true);
    Panel.body.style.paddingBottom = `${h.full - this.visible}px`;
  },
  layout() {
    if (!isMobile()) {
      Panel.el.style.height = ''; Panel.el.style.transform = ''; Panel.body.style.paddingBottom = '';
      Panel.el.classList.remove('dragging');
      this.visible = 0;
      return;
    }
    this.set(this.state);
  },
  snap(velocity) {
    const h = this.heights();
    const order = ['collapsed', 'half', 'full'];
    let target;
    if (Math.abs(velocity) > 0.45) {
      target = velocity < 0
        ? (order.find(k => h[k] > this.visible + 10) || 'full')
        : (order.slice().reverse().find(k => h[k] < this.visible - 10) || 'collapsed');
    } else {
      target = order.reduce((best, k) => Math.abs(h[k] - this.visible) < Math.abs(h[best] - this.visible) ? k : best, 'collapsed');
    }
    this.set(target);
  },
  init() {
    const panel = Panel.el, body = Panel.body;
    // Касания: шторку тянут за «ручку», шапку и тело (если список прокручен к началу).
    panel.addEventListener('touchstart', (e) => {
      if (!isMobile() || e.touches.length !== 1 || e.target.closest('.suggest')) { this.touch = null; return; }
      const t = e.touches[0];
      this.touch = { x0: t.clientX, y0: t.clientY, vis0: this.visible, inBody: body.contains(e.target), decided: false, drag: false, samples: [[performance.now(), t.clientY]] };
    }, { passive: true });
    panel.addEventListener('touchmove', (e) => {
      const s = this.touch;
      if (!s) return;
      const t = e.touches[0];
      const dx = t.clientX - s.x0, dy = t.clientY - s.y0;
      if (!s.decided) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        s.decided = true;
        if (Math.abs(dx) > Math.abs(dy)) s.drag = false;
        else if (s.inBody) s.drag = (dy > 0 && body.scrollTop <= 0) || (dy < 0 && this.state !== 'full');
        else s.drag = true;
        if (s.drag) { s.y0 = t.clientY; s.vis0 = this.visible; }
      }
      if (!s.drag) return;
      if (e.cancelable) e.preventDefault();
      this.apply(s.vis0 - (t.clientY - s.y0), false);
      s.samples.push([performance.now(), t.clientY]);
      if (s.samples.length > 6) s.samples.shift();
    }, { passive: false });
    const end = () => {
      const s = this.touch;
      this.touch = null;
      if (!s || !s.drag) return;
      const a = s.samples[0], b = s.samples[s.samples.length - 1];
      const v = b && a && b[0] - a[0] > 0 ? (b[1] - a[1]) / (b[0] - a[0]) : 0;
      this.snap(v);
    };
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', end);

    // Мышь (узкое окно на ноутбуке): тянем за ручку, клик по ручке — переключение.
    const grab = $('#sheetGrab');
    grab.addEventListener('pointerdown', (e) => {
      if (!isMobile() || e.pointerType === 'touch') return;
      this.mouse = { y0: e.clientY, vis0: this.visible, moved: false, t0: performance.now() };
      grab.setPointerCapture(e.pointerId);
    });
    grab.addEventListener('pointermove', (e) => {
      const s = this.mouse;
      if (!s) return;
      if (Math.abs(e.clientY - s.y0) > 3) s.moved = true;
      if (s.moved) this.apply(s.vis0 - (e.clientY - s.y0), false);
    });
    grab.addEventListener('pointerup', (e) => {
      const s = this.mouse;
      this.mouse = null;
      if (!s) return;
      if (!s.moved) { this.set(this.state === 'collapsed' ? 'half' : this.state === 'half' ? 'full' : 'collapsed'); return; }
      this.snap((e.clientY - s.y0) / Math.max(1, performance.now() - s.t0));
    });
    window.addEventListener('resize', debounce(() => this.layout(), 120));
  }
};

/* =====================================================================
   11. ПОИСК С ПОДСКАЗКАМИ (Photon)
   ===================================================================== */
const STOP_WORDS = new Set(['рядом', 'поблизости', 'около', 'возле', 'близко', 'ближайшая', 'ближайший', 'ближайшие', 'ближайшее',
  'в', 'на', 'у', 'и', 'астана', 'астане', 'астаны', 'круглосуточно', 'круглосуточная', 'круглосуточный', 'круглосуточные',
  '24', 'часа', 'где', 'найти', 'мне', 'хорошая', 'хороший', 'хорошие', 'недорого', 'дешево', 'открытые', 'открытая', 'сейчас']);
function matchCategory(raw) {
  const q = norm(raw);
  if (q.length < 3) return null;
  const tokens = q.split(/[\s,.!?]+/).filter(Boolean);
  for (const cat of CATEGORIES) {
    const hit = (tok) => cat.words.some(w => tok.startsWith(w) || (tok.length >= 3 && w.startsWith(tok)));
    if (!tokens.some(hit)) continue;
    return { cat, exact: tokens.every(t => hit(t) || STOP_WORDS.has(t)) };
  }
  return null;
}
function highlight(text, q) {
  const t = String(text || '');
  const qn = norm(q);
  if (!qn) return esc(t);
  const i = norm(t).indexOf(qn);
  if (i < 0 || norm(t).length !== t.length) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + qn.length)) + '</mark>' + esc(t.slice(i + qn.length));
}
function photonItems(json, q) {
  const seen = new Set();
  const out = [];
  for (const f of (json && json.features) || []) {
    if (!f.geometry || !f.properties) continue;
    const [lon, lat] = f.geometry.coordinates;
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    if (!City.near({ lat, lon })) continue; // далеко за городом — отсекаем
    const place = placeFromPhoton(f);
    const dedupe = place.kind === 'street' ? `street|${norm(place.name)}|${norm(place.area)}` : place.key;
    if (seen.has(dedupe)) continue;
    seen.add(dedupe);
    out.push({ kind: 'place', place, q });
  }
  return out;
}

class Suggest {
  constructor(input, box, { onPick, categories = true, spin = null, clearBtn = null }) {
    this.input = input; this.box = box; this.onPick = onPick; this.categories = categories;
    this.spin = spin; this.clearBtn = clearBtn;
    this.items = []; this.active = -1; this.status = ''; this.ctrl = null; this.catItem = null; this.pendingEnter = false;
    this.run = debounce(() => this.fetch(), 300);
    input.addEventListener('input', () => this.onInput());
    input.addEventListener('keydown', (e) => this.onKey(e));
    input.addEventListener('focus', () => { if (this.input.value.trim() && (this.items.length || this.status)) this.open(); });
    input.addEventListener('blur', () => setTimeout(() => this.close(), 120));
    box.addEventListener('mousedown', (e) => e.preventDefault());
    box.addEventListener('click', (e) => {
      const row = e.target.closest('[data-i]');
      if (row) this.pick(Number(row.dataset.i));
    });
  }
  onInput() {
    const q = this.input.value.trim();
    if (this.ctrl) this.ctrl.abort();
    this.ctrl = null;
    this.active = -1;
    this.pendingEnter = false;
    const m = this.categories ? matchCategory(q) : null;
    this.catItem = m ? { kind: 'category', cat: m.cat, exact: m.exact } : null;
    if (this.clearBtn) this.clearBtn.hidden = !this.input.value;
    if (q.length < 3) {
      this.run.cancel();
      this.items = this.catItem ? [this.catItem] : [];
      this.status = q.length ? (this.catItem ? 'ok' : 'short') : '';
      this.setSpin(false);
      if (q.length) this.render(); else this.close();
      return;
    }
    this.items = this.catItem ? [this.catItem] : [];
    this.status = 'loading';
    this.render();
    this.run();
  }
  async fetch() {
    const q = this.input.value.trim();
    if (q.length < 3) return;
    const ctrl = this.ctrl = new AbortController();
    this.setSpin(true);
    try {
      const json = await Api.photon(q, ctrl.signal);
      if (ctrl !== this.ctrl) return;
      const places = photonItems(json, q);
      this.items = this.catItem ? [this.catItem, ...places] : places;
      this.status = this.items.length ? 'ok' : 'empty';
    } catch (e) {
      if (isAbort(e) || ctrl !== this.ctrl) return;
      this.status = 'error';
      this.errorText = errMessage(e, 'photon');
    }
    this.setSpin(false);
    this.render();
    if (this.pendingEnter) {
      this.pendingEnter = false;
      const i = this.items.findIndex(it => it.kind === 'place');
      if (i >= 0) this.pick(i); else if (this.items.length) this.pick(0);
    }
  }
  setSpin(on) { if (this.spin) this.spin.hidden = !on; }
  render() {
    const q = this.input.value.trim();
    let html = this.items.map((it, i) => {
      const sel = i === this.active ? 'true' : 'false';
      const id = `${this.box.id}-${i}`;
      if (it.kind === 'category') {
        return `<div class="sg" role="option" id="${id}" data-i="${i}" aria-selected="${sel}">
          <span class="sg-ico cat" style="--c:${it.cat.color}">${icon(it.cat.icon)}</span>
          <span class="sg-text"><span class="sg-title">${esc(it.cat.label)}</span><span class="sg-sub">Показать все в видимой области карты</span></span>
          <span class="sg-tag">Рубрика</span></div>`;
      }
      const p = it.place;
      const cat = CAT_BY_ID[p.catId];
      const ico = p.kind === 'org' && cat
        ? `<span class="sg-ico cat" style="--c:${cat.color}">${icon(cat.icon)}</span>`
        : `<span class="sg-ico">${icon(KIND_ICON[p.kind] || 'pin')}</span>`;
      const typeTxt = p.kind === 'house' ? (typeLabel(p.tags) === 'Объект' ? 'Дом' : typeLabel(p.tags)) : placeType(p);
      const sub = [typeTxt, p.kind === 'org' || p.kind === 'house' ? (p.address !== p.name ? p.address : null) || p.area : p.area].filter(Boolean).join(' · ');
      return `<div class="sg" role="option" id="${id}" data-i="${i}" aria-selected="${sel}">${ico}
        <span class="sg-text"><span class="sg-title">${highlight(placeTitle(p), q)}</span><span class="sg-sub">${esc(sub)}</span></span></div>`;
    }).join('');
    if (this.status === 'loading' && !this.items.some(it => it.kind === 'place')) {
      html += `<div class="sk-row" style="padding:8px 10px"><span class="sk sk-circle"></span><span class="sk-lines"><span class="sk sk-line" style="width:62%"></span><span class="sk sk-line" style="width:40%"></span></span></div>`.repeat(2);
    } else if (this.status === 'empty') {
      html += `<div class="sg-msg">${icon('search')}<span>В Астане ничего не нашлось. Проверьте написание или попробуйте другой запрос.</span></div>`;
    } else if (this.status === 'error') {
      html += `<div class="sg-msg">${icon('alert')}<span>${esc(this.errorText)}</span></div>`;
    } else if (this.status === 'short') {
      html += `<div class="sg-msg">${icon('info')}<span>Введите хотя бы 3 символа</span></div>`;
    }
    this.box.innerHTML = html;
    if (html) this.open(); else this.close();
  }
  open() {
    if (document.activeElement !== this.input) return;
    this.box.hidden = false;
    this.input.setAttribute('aria-expanded', 'true');
  }
  close() {
    this.box.hidden = true;
    this.input.setAttribute('aria-expanded', 'false');
    this.input.removeAttribute('aria-activedescendant');
  }
  move(delta) {
    if (!this.items.length) return;
    this.active = (this.active + delta + this.items.length + 1) % (this.items.length + 1);
    if (this.active === this.items.length) this.active = -1;
    for (const row of $$('.sg', this.box)) row.setAttribute('aria-selected', String(Number(row.dataset.i) === this.active));
    if (this.active >= 0) {
      const row = $(`#${this.box.id}-${this.active}`);
      this.input.setAttribute('aria-activedescendant', row.id);
      row.scrollIntoView({ block: 'nearest' });
    } else this.input.removeAttribute('aria-activedescendant');
  }
  onKey(e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (this.box.hidden && this.items.length) { this.open(); return; }
      this.move(e.key === 'ArrowDown' ? 1 : -1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (this.active >= 0) { this.pick(this.active); return; }
      if (this.catItem && this.catItem.exact) { this.pick(this.items.indexOf(this.catItem)); return; }
      const i = this.items.findIndex(it => it.kind === 'place');
      if (i >= 0 && this.status !== 'loading') { this.pick(i); return; }
      if (this.input.value.trim().length >= 3) {
        this.pendingEnter = true;
        if (this.status !== 'loading') { this.status = 'loading'; this.render(); }
        this.run.cancel();
        this.fetch();
      } else if (this.catItem) this.pick(0);
    } else if (e.key === 'Escape') {
      if (!this.box.hidden) { e.preventDefault(); e.stopPropagation(); this.close(); }
      else { this.input.blur(); }
    }
  }
  pick(i) {
    const it = this.items[i];
    if (!it) return;
    this.close();
    this.active = -1;
    this.onPick(it);
  }
  reset(value = '') {
    if (this.ctrl) this.ctrl.abort();
    this.ctrl = null;
    this.run.cancel();
    this.input.value = value;
    this.items = []; this.status = ''; this.catItem = null;
    this.setSpin(false);
    if (this.clearBtn) this.clearBtn.hidden = !value;
    this.close();
  }
}

/* =====================================================================
   12. РУБРИКИ (Overpass)
   ===================================================================== */
const Cat = {
  ctrl: null,
  query(cat, [w, s, e, n]) {
    const bb = `${s},${w},${n},${e}`;
    const parts = cat.filters.map(([k, v, extra = '']) => v.includes('|')
      ? `nwr["${k}"~"^(${v})$"]${extra}(${bb});`
      : `nwr["${k}"="${v}"]${extra}(${bb});`);
    return `[out:json][timeout:25];(${parts.join('')});out tags center ${OVERPASS_LIMIT};`;
  },
  async run(id, { bbox } = {}) {
    const cat = CAT_BY_ID[id];
    if (!cat) return;
    if (this.ctrl) this.ctrl.abort();
    const ctrl = this.ctrl = new AbortController();
    const box = bbox || M.visibleBbox();
    S.cat = { id, items: [], status: 'loading', error: '', note: '', bbox: box, center: M.visibleCenter(), zoom: map.getZoom(), truncated: false };
    UI.searchSuggest.reset(cat.label);
    UI.renderChips();
    UI.searchAreaBtn.hidden = true;
    M.setPoi([]);
    M.setHighlight(null);
    Panel.show('results');
    this.render();
    Hash.write();
    try {
      const json = await Api.overpass(this.query(cat, box), ctrl.signal, (n) => {
        if (ctrl !== this.ctrl) return;
        S.cat.note = `Серверы справочника перегружены — повторяем запрос (попытка ${n})…`;
        this.render();
      });
      if (ctrl !== this.ctrl) return;
      const seen = new Set();
      const items = [];
      for (const el of json.elements || []) {
        const p = placeFromElement(el, catOfTags(el.tags || {}) || id);
        if (p && !seen.has(p.key)) { seen.add(p.key); items.push(p); }
      }
      S.cat.items = items;
      S.cat.truncated = (json.elements || []).length >= OVERPASS_LIMIT;
      S.cat.status = 'ok';
    } catch (e) {
      if (isAbort(e) || ctrl !== this.ctrl) return;
      await this.fallback(cat, box, ctrl, e);
      if (ctrl !== this.ctrl) return;
    }
    this.render();
    this.syncMap();
  },
  /** Overpass не ответил — показываем упрощённый список из категорий Photon. */
  async fallback(cat, box, ctrl, overpassErr) {
    S.cat.note = 'Справочник перегружен — загружаем упрощённый список…';
    this.render();
    try {
      const json = await Api.photonCategory(PHOTON_INCLUDE[cat.id], box, ctrl.signal);
      if (ctrl !== this.ctrl) return;
      const seen = new Set();
      const items = [];
      for (const f of json.features || []) {
        if (!f.geometry || !f.properties) continue;
        const p = placeFromPhoton(f);
        if (!City.near(p) || seen.has(p.key)) continue;
        seen.add(p.key);
        p.catId = p.catId || cat.id;
        items.push(p);
      }
      S.cat.items = items;
      S.cat.lite = true;
      S.cat.truncated = false;
      S.cat.status = 'ok';
    } catch (e) {
      if (isAbort(e) || ctrl !== this.ctrl) return;
      S.cat.status = 'error';
      S.cat.error = errMessage(overpassErr, 'overpass');
    }
  },
  clear() {
    if (this.ctrl) this.ctrl.abort();
    this.ctrl = null;
    if (!S.cat) return;
    S.cat = null;
    S.hoverId = null;
    UI.searchSuggest.reset('');
    UI.renderChips();
    UI.searchAreaBtn.hidden = true;
    M.setPoi([]);
    M.setHighlight(null);
    $('#vResults').innerHTML = '';
    Hash.write();
  },
  originKind() {
    const wantUser = S.sort === 'user' || (S.sort === 'auto' && Geo.inCity());
    return wantUser && S.user ? 'user' : 'center';
  },
  visibleItems() {
    if (!S.cat) return [];
    const o = this.originKind() === 'user' ? S.user : S.cat.center;
    let list = S.cat.items;
    if (S.openOnly && !S.cat.lite) list = list.filter(it => Hours.isOpen(it.tags.opening_hours));
    for (const it of list) it.dist = haversine(o, it);
    return list.slice().sort((a, b) => a.dist - b.dist);
  },
  syncMap() { M.setPoi(this.visibleItems()); },
  render() {
    const el = $('#vResults');
    const c = S.cat;
    if (!c) { el.innerHTML = ''; return; }
    const cat = CAT_BY_ID[c.id];
    let html = `<div class="view-bar"><span class="kind-ico" style="--c:${cat.color}">${icon(cat.icon)}</span><h2>${esc(cat.label)}</h2>
      <button class="icon-btn" type="button" data-act="close-results" aria-label="Закрыть рубрику" title="Закрыть рубрику">${icon('close')}</button></div>`;
    if (c.status === 'loading') {
      html += `<div class="res-meta">${esc(c.note || 'Ищем в видимой области карты…')}</div>${skeletonList(6)}`;
    } else if (c.status === 'error') {
      html += emptyBlock('alert', 'Не удалось загрузить список', c.error, `<button class="btn btn-primary" type="button" data-act="retry-cat">${icon('refresh')}Повторить</button>`, true);
    } else {
      const list = this.visibleItems();
      const total = c.items.length;
      const ok = !Hours.failed && !c.lite;
      const kind = this.originKind();
      const meta = `Найдено ${total} ${plural(total, 'место', 'места', 'мест')}` +
        (S.openOnly && total ? ` · открыто ${list.length}` : '') +
        (total ? ` · ${kind === 'user' ? 'ближе к вам' : 'от центра карты'}` : '');
      html += `<div class="res-meta">${esc(meta)}</div>`;
      if (total) {
        html += `<div class="res-tools">
          <button class="toggle" type="button" data-act="open-now" aria-pressed="${S.openOnly}" ${ok ? '' : 'disabled title="Библиотека часов работы недоступна"'}>${icon('clock')}Открыто сейчас</button>
          <div class="seg" role="group" aria-label="Сортировка по расстоянию">
            <button type="button" data-sort="center" aria-pressed="${kind === 'center'}">От центра карты</button>
            <button type="button" data-sort="user" aria-pressed="${kind === 'user'}">От меня</button>
          </div></div>`;
      }
      if (!total) {
        html += emptyBlock('search', 'Здесь ничего не нашлось', 'Отдалите или сдвиньте карту и нажмите «Искать в этой области».');
      } else if (!list.length) {
        html += emptyBlock('clock', 'Сейчас всё закрыто', 'Снимите фильтр «Открыто сейчас», чтобы увидеть все места.',
          `<button class="btn btn-soft" type="button" data-act="open-now">Показать все</button>`);
      } else {
        if (c.lite) html += `<p class="note" style="margin:4px 2px 8px">Основной справочник сейчас перегружен — показан упрощённый список (до 50 мест, без часов работы). Позже нажмите «Искать в этой области» для полного списка.</p>`;
        html += `<div class="res-list" id="resList">${list.map(it => this.row(it)).join('')}</div>`;
        if (c.truncated) html += `<p class="note">Показаны первые ${OVERPASS_LIMIT} мест. Приблизьте карту, чтобы увидеть остальные.</p>`;
      }
    }
    el.innerHTML = html;
  },
  row(it) {
    const cat = CAT_BY_ID[it.catId] || CAT_BY_ID[S.cat.id];
    const st = Hours.status(it.tags.opening_hours);
    const sub = [typeLabel(it.tags), it.address].filter(Boolean).join(' · ');
    const stHtml = st.kind === 'none' ? '' : `<span class="st st-${st.kind}">${esc(st.kind === 'raw' ? `Часы: ${st.text}` : st.text)}</span>`;
    return `<button class="res-item${S.hoverId === it.key ? ' hover' : ''}" type="button" data-id="${esc(it.key)}">
      <span class="kind-ico" style="--c:${cat.color}">${icon(cat.icon)}</span>
      <span class="ri-main"><span class="ri-title">${esc(placeTitle(it))}</span><span class="ri-sub">${esc(sub)}</span>${stHtml}</span>
      <span class="ri-dist">${fmtDist(it.dist || 0)}</span></button>`;
  },
  find(key) { return S.cat ? S.cat.items.find(it => it.key === key) : null; }
};

function setHover(key, from) {
  if (S.hoverId === key) return;
  S.hoverId = key;
  const item = key ? Cat.find(key) : null;
  M.setHighlight(item);
  for (const row of $$('.res-item.hover')) row.classList.remove('hover');
  if (item) {
    const row = $(`.res-item[data-id="${CSS.escape(key)}"]`);
    if (row) {
      row.classList.add('hover');
      if (from === 'map' && S.view === 'results') row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
}

function skeletonList(n) {
  return `<div aria-hidden="true">${`<div class="sk-row"><span class="sk sk-circle"></span><span class="sk-lines"><span class="sk sk-line" style="width:68%"></span><span class="sk sk-line" style="width:46%"></span><span class="sk sk-line" style="width:30%"></span></span></div>`.repeat(n)}</div>`;
}
function emptyBlock(ic, title, text, action = '', isErr = false) {
  return `<div class="empty${isErr ? ' err' : ''}" role="${isErr ? 'alert' : 'status'}">${icon(ic)}<h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;
}

/* =====================================================================
   13. КАРТОЧКА ОБЪЕКТА
   ===================================================================== */
const Place = {
  ctrl: null,
  open(place, { fly = true, extent = null } = {}) {
    if (this.ctrl) this.ctrl.abort();
    const ctrl = this.ctrl = new AbortController();
    S.place = place;
    M.setSelected(place);
    Panel.show('place');
    renderPlace();
    if (fly) M.flyToPlace(place, extent);
    Hash.write();
    this.enrich(place, ctrl.signal);
  },
  async enrich(place, signal) {
    // 1) детали организации (часы, телефон) — один запрос к Overpass по id
    if (place.needsDetails) {
      place.detailsLoading = true;
      renderPlace();
      try {
        const el = await Api.overpassById(place.osmType, place.osmId, signal);
        if (S.place !== place) return;
        if (el && el.tags) {
          place.tags = Object.assign({}, place.tags, el.tags);
          place.catId = place.catId || catOfTags(el.tags);
          place.address = place.address || addrFromTags(el.tags);
        }
      } catch (e) {
        if (isAbort(e) || S.place !== place) return;
        place.detailsError = true;
      }
      place.needsDetails = false;
      place.detailsLoading = false;
      renderPlace();
    }
    // 2) адрес: из addr:* или обратным геокодингом
    if (!place.address && !place.addressTried && place.kind !== 'street' && place.kind !== 'district') {
      place.addressLoading = true;
      renderPlace();
      try {
        const r = await Api.reverse(place.lat, place.lon, signal);
        if (S.place !== place) return;
        const n = placeFromNominatim(r, place.lat, place.lon);
        place.address = n.address;
        place.area = place.area || n.area;
      } catch (e) {
        if (isAbort(e) || S.place !== place) return;
      }
      place.addressTried = true;
      place.addressLoading = false;
      renderPlace();
    }
  },
  async openPoint(lat, lon, { fly = false } = {}) {
    if (this.ctrl) this.ctrl.abort();
    const ctrl = this.ctrl = new AbortController();
    const stub = { key: `pt/${lat.toFixed(5)},${lon.toFixed(5)}`, kind: 'point', lat, lon, tags: {}, loading: true, source: 'nominatim' };
    S.place = stub;
    M.setSelected(stub);
    Panel.show('place');
    renderPlace();
    if (fly) M.flyToPlace(stub);
    Hash.write();
    try {
      const r = await Api.reverse(lat, lon, ctrl.signal);
      if (S.place !== stub) return;
      if (r && r.error) throw new ApiError('nominatim', 'notfound');
      S.place = placeFromNominatim(r, lat, lon);
    } catch (e) {
      if (isAbort(e) || S.place !== stub) return;
      S.place = Object.assign({}, stub, { loading: false, typeLabel: 'Точка на карте', addressTried: true,
        note: e.kind === 'notfound' ? 'Здесь нет адреса в OpenStreetMap.' : errMessage(e, 'nominatim') });
    }
    renderPlace();
    Hash.write();
  },
  async openById(type, id, { fly = false } = {}) {
    if (this.ctrl) this.ctrl.abort();
    const ctrl = this.ctrl = new AbortController();
    const stub = { key: `${type}/${id}`, kind: 'org', osmType: type, osmId: id, loading: true, tags: {} };
    S.place = stub;
    Panel.show('place');
    renderPlace();
    try {
      const el = await Api.overpassById(type, id, ctrl.signal);
      if (S.place !== stub) return;
      const p = el && placeFromElement(el);
      if (!p) throw new ApiError('overpass', 'notfound');
      this.open(p, { fly });
    } catch (e) {
      if (isAbort(e) || S.place !== stub) return;
      stub.loading = false;
      stub.error = e.kind === 'notfound' ? 'Объект не найден — возможно, его удалили из OpenStreetMap.' : errMessage(e, 'overpass');
      renderPlace();
    }
  },
  close() {
    if (this.ctrl) this.ctrl.abort();
    this.ctrl = null;
    S.place = null;
    M.setSelected(null);
  },
  asPoint(p) { return { lat: p.lat, lon: p.lon, label: placeTitle(p) }; },
  async share() {
    Hash.flush();
    const url = location.href;
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(url); ok = true; }
    } catch (e) { ok = false; }
    if (!ok) {
      const ta = document.createElement('textarea');
      ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
    }
    toast(ok ? 'Ссылка скопирована — откроется это же место на карте' : 'Не удалось скопировать. Ссылка — в адресной строке браузера.', { type: ok ? 'ok' : 'error' });
  }
};

function renderPlace() {
  const el = $('#vPlace');
  const p = S.place;
  const prev = Panel.stack[Panel.stack.length - 2];
  const backTo = prev === 'results' ? 'К списку' : prev === 'route' ? 'К маршруту' : '';
  const bar = `<div class="view-bar"><button class="icon-btn" type="button" data-act="back" aria-label="${backTo || 'Закрыть карточку'}" title="${backTo || 'Закрыть'}">${icon(backTo ? 'back' : 'close')}</button><span class="bar-label">${esc(backTo)}</span></div>`;
  if (!p) { el.innerHTML = bar; return; }
  if (p.loading) {
    el.innerHTML = bar + `<div aria-hidden="true"><span class="sk sk-line" style="width:35%;margin:6px 0 14px"></span><span class="sk" style="height:26px;width:80%;margin-bottom:10px"></span><span class="sk sk-line" style="width:45%;margin-bottom:20px"></span><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">${'<span class="sk" style="height:64px;border-radius:12px"></span>'.repeat(4)}</div><span class="sk sk-line" style="width:90%;margin-bottom:12px"></span><span class="sk sk-line" style="width:70%"></span></div>`;
    return;
  }
  if (p.error) { el.innerHTML = bar + emptyBlock('alert', 'Не удалось открыть объект', p.error, '', true); return; }
  const t = p.tags || {};
  const cat = CAT_BY_ID[p.catId];
  const color = cat ? cat.color : 'var(--brand)';
  const ico = cat ? cat.icon : (KIND_ICON[p.kind] || 'pin');
  const st = Hours.status(t.opening_hours);
  const statusHtml = st.kind === 'none' || st.kind === 'raw' ? '' : `<div class="place-status st-${st.kind}">${esc(st.text)}</div>`;
  const facts = [];
  const skLine = (w) => `<span class="sk sk-line" style="width:${w}%;margin-top:4px"></span>`;
  if (p.addressLoading) facts.push(['pin', skLine(70)]);
  else if (p.address) facts.push(['pin', `${esc(p.address)}${p.area ? `<small>${esc(p.area)}</small>` : ''}`]);
  else if (p.area) facts.push(['pin', esc(p.area)]);
  if (t.opening_hours) {
    facts.push(['clock', `<div class="sched">${Hours.pretty(t.opening_hours).map(r => `<span>${esc(r)}</span>`).join('')}</div>`]);
  } else if (p.detailsLoading) facts.push(['clock', skLine(55)]);
  const phones = String(t.phone || t['contact:phone'] || '').split(/\s*[;,]\s*/).filter(Boolean);
  if (phones.length) facts.push(['phone', phones.map(ph => `<a href="tel:${esc(ph.replace(/[^\d+]/g, ''))}">${esc(ph)}</a>`).join('<br>')]);
  let site = t.website || t['contact:website'] || t.url;
  if (site) {
    site = String(site).split(';')[0].trim();
    if (!/^https?:\/\//i.test(site)) site = 'https://' + site;
    let host = site;
    try { host = new URL(site).hostname.replace(/^www\./, ''); } catch (e) { /* оставляем как есть */ }
    if (/^https?:\/\//i.test(site)) facts.push(['globe', `<a href="${esc(site)}" target="_blank" rel="noopener nofollow">${esc(host)}</a>`]);
  }
  if (t.wheelchair) {
    const w = { yes: 'Доступно для колясок', limited: 'Частично доступно для колясок', no: 'Недоступно для колясок', designated: 'Оборудовано для колясок' }[t.wheelchair];
    if (w) facts.push(['wheelchair', esc(w)]);
  }
  if (t.cuisine && (cat ? cat.id === 'food' : true)) {
    const list = String(t.cuisine).split(/\s*;\s*/).map(c => CUISINE_RU[c.toLowerCase()] || c.replace(/_/g, ' '));
    facts.push(['utensils', `Кухня: ${esc(list.join(', '))}`]);
  }
  if (t.amenity === 'parking') {
    const bits = [];
    if (t.fee === 'yes') bits.push('платная'); else if (t.fee === 'no') bits.push('бесплатная');
    if (t.capacity && /^\d+$/.test(t.capacity)) bits.push(`${t.capacity} ${plural(+t.capacity, 'место', 'места', 'мест')}`);
    if (bits.length) facts.push(['parking', esc(bits.join(', ').replace(/^./, s => s.toUpperCase()))]);
  }
  const brand = t.operator || t.brand;
  if (brand && brand !== placeTitle(p)) facts.push(['tag', `${esc(brand)}<small>${t.operator ? 'Оператор' : 'Сеть'}</small>`]);
  if (p.detailsError) facts.push(['info', '<span class="muted">Подробности временно недоступны — справочник перегружен.</span>']);
  if (p.note) facts.push(['info', `<span class="muted">${esc(p.note)}</span>`]);
  facts.push(['nav', `<span class="coords">${fmtCoord(p.lat, p.lon)}</span>`]);

  el.innerHTML = bar + `
    <div class="place-kind"><span class="kind-ico" style="--c:${color}">${icon(ico)}</span>${esc(placeType(p))}</div>
    <h2 class="place-title">${esc(placeTitle(p))}</h2>
    ${statusHtml}
    <div class="actions">
      <button class="act primary" type="button" data-act="route-to">${icon('route')}Маршрут сюда</button>
      <button class="act" type="button" data-act="route-from">${icon('nav')}Отсюда</button>
      <button class="act" type="button" data-act="share">${icon('share')}Поделиться</button>
      <a class="act" href="${esc(osmUrl(p))}" target="_blank" rel="noopener">${icon('external')}Открыть в OSM</a>
    </div>
    <ul class="facts">${facts.map(([i, h]) => `<li>${icon(i)}<div>${h}</div></li>`).join('')}</ul>`;
}

/* =====================================================================
   14. МАРШРУТЫ (OSRM FOSSGIS)
   ===================================================================== */
const DIR_RU = { uturn: 'на разворот', 'sharp right': 'резко направо', right: 'направо', 'slight right': 'плавно направо', straight: 'прямо', 'slight left': 'плавно налево', left: 'налево', 'sharp left': 'резко налево' };
const SIDE_RU = { 'sharp right': 'правее', right: 'правее', 'slight right': 'правее', 'sharp left': 'левее', left: 'левее', 'slight left': 'левее', straight: 'прямо' };
const COMPASS_RU = ['север', 'северо-восток', 'восток', 'юго-восток', 'юг', 'юго-запад', 'запад', 'северо-запад'];
function roadName(step) {
  const n = (step.name || '').trim(), r = (step.ref || '').trim();
  if (n && r && !n.includes(r)) return `${n} (${r})`;
  return n || r;
}
function stepText(step) {
  const m = step.maneuver || {};
  const mod = m.modifier;
  const name = roadName(step);
  const onto = name ? ` на ${name}` : '';
  const along = name ? ` по ${name}` : '';
  const dir = DIR_RU[mod] || '';
  switch (m.type) {
    case 'depart': {
      const b = Number.isFinite(m.bearing_after) ? COMPASS_RU[Math.round(m.bearing_after / 45) % 8] : '';
      return `Начните движение${b ? ` на ${b}` : ''}${along}`;
    }
    case 'arrive':
      if (mod === 'left' || mod === 'slight left' || mod === 'sharp left') return 'Вы прибыли, пункт назначения слева';
      if (mod === 'right' || mod === 'slight right' || mod === 'sharp right') return 'Вы прибыли, пункт назначения справа';
      return 'Вы прибыли';
    case 'turn':
    case 'end of road': {
      const pre = m.type === 'end of road' ? 'В конце дороги ' : '';
      if (mod === 'uturn') return `${pre}${pre ? 'р' : 'Р'}азвернитесь${along}`;
      if (mod === 'straight' || !mod) return `${pre}${pre ? 'п' : 'П'}родолжайте прямо${along}`;
      return `${pre}${pre ? 'п' : 'П'}оверните ${dir}${onto}`;
    }
    case 'new name': return name ? `Продолжайте по ${name}` : 'Продолжайте движение';
    case 'continue':
      if (mod === 'uturn') return `Развернитесь${along}`;
      if (mod && mod !== 'straight') return `Держитесь ${SIDE_RU[mod]}${along}`;
      return `Продолжайте прямо${along}`;
    case 'merge': {
      const side = mod && mod.includes('left') ? ' левее' : mod && mod.includes('right') ? ' правее' : '';
      return `Перестройтесь${side} и продолжайте${along}`;
    }
    case 'on ramp': return `Заезжайте на съезд${mod && mod !== 'straight' ? ' ' + dir : ''}${onto}`;
    case 'off ramp': return `Сверните на съезд${mod && mod !== 'straight' ? ' ' + dir : ''}${onto}`;
    case 'fork': return `На развилке держитесь ${SIDE_RU[mod] || 'прямо'}${along}`;
    case 'use lane': return `Займите полосу и двигайтесь ${dir || 'прямо'}${along}`;
    case 'roundabout':
    case 'rotary':
      if (m.exit) return `На круговом движении — ${m.exit}-й съезд${onto}`;
      return `Въезжайте на круговое движение${step.rotary_name ? ` «${step.rotary_name}»` : ''}`;
    case 'roundabout turn': return `На круговом движении поверните ${dir}${onto}`;
    case 'exit roundabout':
    case 'exit rotary': return `Съезжайте с кругового движения${onto}`;
    default: return name ? `Продолжайте по ${name}` : 'Продолжайте движение';
  }
}
function stepIcon(step) {
  const m = step.maneuver || {};
  const mod = m.modifier || '';
  if (m.type === 'depart') return icon('dot');
  if (m.type === 'arrive') return icon('flag');
  if (/roundabout|rotary/.test(m.type)) return icon('roundabout');
  if (mod === 'uturn') return icon('uturn');
  if (!mod || mod === 'straight') return icon('straight');
  const base = mod.includes('slight') ? 'slightRight' : mod.includes('sharp') ? 'sharpRight' : 'right';
  return icon(base, mod.includes('left') ? 'flip' : '');
}
function arrivalText(sec) {
  const d = cityNow();
  d.setSeconds(d.getSeconds() + sec);
  return `прибытие в ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

const Route = {
  ctrl: null,
  open({ a, b } = {}) {
    if (a) S.route.a = a;
    if (b) S.route.b = b;
    if (!S.route.a && S.user && Geo.inCity() && S.route.b) S.route.a = { lat: S.user.lat, lon: S.user.lon, label: 'Моё местоположение' };
    Panel.show('route');
    M.setAB();
    this.render();
    if (S.route.a && S.route.b) this.compute({ fit: true });
    else {
      Hash.write();
      if (!isMobile()) setTimeout(() => (S.route.a ? UI.rB : UI.rA).focus(), 50);
    }
  },
  setPoint(which, pt, { fit = true } = {}) {
    S.route[which] = pt;
    S.route.stepIdx = -1;
    M.setStep(null);
    M.setAB();
    if (S.view !== 'route') Panel.show('route');
    this.render();
    this.compute({ fit });
  },
  swap() {
    const r = S.route;
    [r.a, r.b] = [r.b, r.a];
    M.setAB();
    this.render();
    this.compute({ fit: false });
  },
  setMode(mode) {
    if (S.route.mode === mode) return;
    S.route.mode = mode;
    this.render();
    this.compute({ fit: true });
  },
  async compute({ fit = true, keepActive = false } = {}) {
    const r = S.route;
    if (this.ctrl) this.ctrl.abort();
    this.ctrl = null;
    if (!r.a || !r.b) {
      r.routes = []; r.status = 'idle';
      M.setRoute(); this.render(); Hash.write();
      return;
    }
    const ctrl = this.ctrl = new AbortController();
    r.status = 'loading';
    r.stepIdx = -1;
    M.setStep(null);
    this.render();
    try {
      const json = await Api.route(r.mode, r.a, r.b, ctrl.signal);
      if (ctrl !== this.ctrl) return;
      if (!json || json.code !== 'Ok' || !json.routes || !json.routes.length) throw new ApiError('osrm', 'noroute');
      // Схлопываем «альтернативы», которые совпадают с уже показанными по времени и длине.
      const routes = [];
      for (const rt of json.routes) {
        if (routes.some(x => Math.abs(x.duration - rt.duration) < 30 && Math.abs(x.distance - rt.distance) < 60)) continue;
        routes.push(rt);
      }
      const want = keepActive ? r.active : 0;
      r.routes = routes;
      r.active = clamp(want, 0, routes.length - 1);
      r.status = 'ok';
      M.setRoute();
      if (fit) M.fitRoute();
    } catch (e) {
      if (isAbort(e) || ctrl !== this.ctrl) return;
      r.status = 'error';
      r.error = errMessage(e && e.kind === 'http' && e.status === 400 && /NoRoute/i.test(e.detail) ? new ApiError('osrm', 'noroute') : e, 'osrm');
      r.routes = [];
      M.setRoute();
    }
    this.render();
    Hash.write();
  },
  select(idx) {
    const r = S.route;
    if (idx === r.active || !r.routes[idx]) return;
    r.active = idx;
    r.stepIdx = -1;
    M.setStep(null);
    M.setRoute();
    this.render();
    Hash.write();
  },
  clear() {
    if (this.ctrl) this.ctrl.abort();
    this.ctrl = null;
    Object.assign(S.route, { a: null, b: null, routes: [], active: 0, status: 'idle', error: '', stepIdx: -1 });
    UI.rASuggest.reset('');
    UI.rBSuggest.reset('');
    M.setAB(); M.setRoute(); M.setStep(null);
    Hash.write();
  },
  focusStep(i) {
    const rt = S.route.routes[S.route.active];
    const step = rt && rt.legs.flatMap(l => l.steps)[i];
    if (!step) return;
    S.route.stepIdx = i;
    const loc = step.maneuver.location;
    M.setStep(loc);
    map.flyTo({ center: loc, zoom: Math.max(map.getZoom(), 16.5), offset: M.offset(), duration: 900 });
    for (const b of $$('.step')) b.classList.toggle('on', Number(b.dataset.i) === i);
  },
  render() {
    const r = S.route;
    for (const [which, input, sg] of [['a', UI.rA, UI.rASuggest], ['b', UI.rB, UI.rBSuggest]]) {
      if (document.activeElement !== input) {
        input.value = r[which] ? r[which].label : '';
        sg.clearBtn.hidden = !input.value;
      }
    }
    for (const b of $$('#modes button')) b.setAttribute('aria-pressed', String(b.dataset.mode === r.mode));
    const active = r.status === 'ok' ? r.routes[r.active] : null;
    $('#routeSum').textContent = active ? `${fmtDuration(active.duration)} · ${fmtDist(active.distance)}` : '';
    const body = $('#routeBody');
    if (!r.a || !r.b) {
      body.innerHTML = emptyBlock('route', r.a || r.b ? 'Укажите вторую точку' : 'Откуда и куда едем?',
        'Найдите адрес в полях выше, нажмите «Маршрут сюда» в карточке места или кликните правой кнопкой мыши по карте (на телефоне — долгое нажатие).',
        r.a ? '' : `<button class="btn btn-soft" type="button" data-act="use-my-loc">${icon('locate')}Моё местоположение как А</button>`);
      return;
    }
    if (r.status === 'loading') {
      body.innerHTML = `<div aria-hidden="true"><span class="sk" style="height:62px;border-radius:12px;margin-bottom:8px"></span><span class="sk" style="height:62px;border-radius:12px;opacity:.6"></span></div>${skeletonList(4)}`;
      return;
    }
    if (r.status === 'error') {
      body.innerHTML = emptyBlock('alert', 'Маршрут не построен', r.error, `<button class="btn btn-primary" type="button" data-act="retry-route">${icon('refresh')}Повторить</button>`, true);
      return;
    }
    if (r.status !== 'ok') { body.innerHTML = ''; return; }
    const fastest = Math.min(...r.routes.map(x => x.duration));
    let html = `<div class="alts" role="group" aria-label="Варианты маршрута">${r.routes.map((rt, i) => {
      const tag = rt.duration === fastest ? 'Быстрее всего' : `+${fmtDuration(rt.duration - fastest)}`;
      return `<button class="alt" type="button" data-alt="${i}" aria-pressed="${i === r.active}">
        <span class="alt-main">${fmtDuration(rt.duration)} <span>· ${fmtDist(rt.distance)}</span></span>
        <span class="alt-eta">${arrivalText(rt.duration)}</span><span class="alt-tag">${tag}</span></button>`;
    }).join('')}</div>`;
    const steps = active.legs.flatMap(l => l.steps);
    html += `<div class="steps-h">Как ехать${r.mode === 'foot' ? ' (пешком)' : r.mode === 'bike' ? ' (на велосипеде)' : ''}</div><ol class="steps">${steps.map((s, i) => `
      <li><button class="step${i === r.stepIdx ? ' on' : ''}" type="button" data-i="${i}"><span class="step-ico">${stepIcon(s)}</span>
      <span class="step-txt">${esc(stepText(s))}</span><span class="step-dist">${s.distance > 0 ? fmtDist(s.distance) : ''}</span></button></li>`).join('')}</ol>
      <p class="note">Маршрут ориентировочный: данные OpenStreetMap, без учёта пробок.</p>`;
    body.innerHTML = html;
  }
};

const Geo = {
  pending: null,
  inCity() { return City.near(S.user); },
  locate({ fly = true } = {}) {
    if (this.pending) return this.pending;
    if (!window.isSecureContext) {
      toast('Геолокация работает только по HTTPS или на localhost. Откройте демо по защищённой ссылке.', { type: 'error', timeout: 6000 });
      return Promise.reject(new Error('insecure'));
    }
    if (!('geolocation' in navigator)) {
      toast('Этот браузер не умеет определять местоположение.', { type: 'error' });
      return Promise.reject(new Error('unsupported'));
    }
    const btn = UI.locateBtn;
    btn.classList.add('busy');
    this.pending = new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
        (err) => reject(err),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    }).then((p) => {
      S.user = p;
      M.setUser(p);
      if (Geo.inCity()) {
        if (fly) map.flyTo({ center: [p.lon, p.lat], zoom: Math.max(map.getZoom(), 15), offset: M.offset(), duration: 1200 });
      } else {
        const km = Math.round(haversine(CITY.center, p) / 1000);
        toast(`Вы в ${km} км от Астаны — расстояния считаем от центра карты.`, {
          action: { label: 'Показать меня', fn: () => map.flyTo({ center: [p.lon, p.lat], zoom: 13 }) }, timeout: 7000
        });
      }
      if (S.cat && S.cat.status === 'ok') { Cat.render(); Cat.syncMap(); }
      return p;
    }, (err) => {
      const code = err && err.code;
      const msg = code === 1 ? 'Доступ к местоположению запрещён. Разрешите его в настройках браузера для этого сайта.'
        : code === 3 ? 'Не удалось определить местоположение за отведённое время. Попробуйте ещё раз.'
        : 'Местоположение сейчас недоступно. Проверьте, включена ли геолокация на устройстве.';
      toast(msg, { type: 'error', timeout: 6000 });
      throw err;
    }).finally(() => {
      this.pending = null;
      btn.classList.remove('busy');
    });
    return this.pending;
  }
};

/**
 * В стилях OpenFreeMap есть сравнения вида ["<=", ["get","rank"], 2], а у части объектов rank = null —
 * MapLibre при этом пишет предупреждения в консоль. Оборачиваем такие сравнения проверкой типа
 * (объект и так отфильтровался бы) и подставляем 0 для пустой высоты 3D-зданий.
 */
function patchStyle(style) {
  const CMP = new Set(['<', '<=', '>', '>=']);
  const isGet = (x) => Array.isArray(x) && x[0] === 'get' && typeof x[1] === 'string' && x.length === 2;
  const walk = (e) => {
    if (!Array.isArray(e)) return e;
    if (CMP.has(e[0]) && e.length === 3 && (isGet(e[1]) || isGet(e[2]))) {
      const g = isGet(e[1]) ? e[1] : e[2];
      return ['case', ['==', ['typeof', g], 'number'], e, false];
    }
    return e.map(walk);
  };
  for (const l of style.layers) {
    if (l.filter) l.filter = walk(l.filter);
    if (l.type === 'fill-extrusion' && l.paint) {
      l.paint['fill-extrusion-height'] = ['coalesce', ['get', 'render_height'], 0];
      l.paint['fill-extrusion-base'] = ['coalesce', ['get', 'render_min_height'], 0];
    }
  }
  return style;
}

const Theme = {
  async loadStyle(theme) {
    if (M.styleCache[theme]) return M.styleCache[theme];
    const json = await fetchJSON('style', STYLE_URLS[theme], { timeout: 12000 });
    if (!json || !Array.isArray(json.layers)) throw new ApiError('style', 'parse');
    M.styleCache[theme] = patchStyle(json);
    return json;
  },
  applyUi(theme) {
    S.theme = theme;
    document.documentElement.dataset.theme = theme;
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.content = theme === 'dark' ? '#1B1F25' : '#0A7EA4';
    UI.themeBtn.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
    UI.themeBtn.title = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
  },
  async toggle() {
    const next = S.theme === 'dark' ? 'light' : 'dark';
    UI.themeBtn.disabled = true;
    try {
      const style = await this.loadStyle(next);  // проверяем, что стиль отвечает, до переключения
      this.applyUi(next);
      lsSet('korset.theme', next);
      M.styleReady = false;
      map.setStyle(structuredClone(style), { diff: false }); // style.load вернёт наши слои и данные
    } catch (e) {
      toast(`Не удалось загрузить ${next === 'dark' ? 'тёмную' : 'светлую'} тему карты. Оставили текущую.`, { type: 'error' });
    } finally {
      UI.themeBtn.disabled = false;
    }
  }
};

const ThreeD = {
  guard: false,
  set(on, animate = true) {
    S.is3D = on;
    UI.btn3d.setAttribute('aria-pressed', String(on));
    UI.btn3d.innerHTML = `<span class="txt">${on ? '2D' : '3D'}</span>`;
    UI.btn3d.title = on ? 'Плоская карта (2D)' : 'Объёмные здания (3D)';
    if (M.styleReady) { if (on) M.ensure3D(); else M.remove3D(); } // иначе слой добавит onStyle()
    if (!animate || !map) return;
    this.guard = true;
    if (on) map.easeTo({ pitch: 60, bearing: map.getBearing() || -18, zoom: Math.max(map.getZoom(), 15.3), duration: 1100 });
    else map.easeTo({ pitch: 0, bearing: 0, duration: 800 });
    map.once('moveend', () => { this.guard = false; });
  },
  /** Пользователь наклонил карту жестом — синхронизируем кнопку. */
  sync() {
    if (this.guard) return;
    const p = map.getPitch();
    if (p > 12 && !S.is3D) this.set(true, false);
    else if (p < 4 && S.is3D) this.set(false, false);
  }
};

    el.style.left = `${clamp(point.x + 4, 8, W - w - 8)}px`;
    el.style.top = `${clamp(point.y + 4, 8, H - h - 8)}px`;

  },

    const pt = { lat: ll.lat, lon: ll.lon, label: 'Точка на карте' };
    if (kind === 'from') Route.open({ a: pt });
    else if (kind === 'to') Route.open({ b: pt });
    else Place.openPoint(ll.lat, ll.lon);

function toast(msg, { type = 'info', action = null, timeout = 4200 } = {}) {
  const box = UI.toasts;
  while (box.children.length >= 3) box.firstElementChild.remove();
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.setAttribute('role', type === 'error' ? 'alert' : 'status');
  t.innerHTML = `${icon(type === 'error' ? 'alert' : type === 'ok' ? 'check' : 'info')}<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) $('button', t).addEventListener('click', () => { action.fn(); t.remove(); });
  box.appendChild(t);
  setTimeout(() => t.remove(), timeout);
}

/* =====================================================================
   17. СОСТОЯНИЕ В URL-ХЭШЕ
   ===================================================================== */
const Hash = {
  last: null, timer: null,
  parse(str) {
    const out = {};
    for (const part of String(str || '').replace(/^#/, '').split('&')) {
      const i = part.indexOf('=');
      if (i > 0) {
        try { out[part.slice(0, i)] = decodeURIComponent(part.slice(i + 1)); } catch (e) { /* битый параметр */ }
      }
    }
    return out;
  },
  camera(h) {
    const m = (h.map || '').split('/').map(Number);
    if (m.length >= 3 && m.slice(0, 3).every(Number.isFinite) && Math.abs(m[1]) <= 85 && Math.abs(m[2]) <= 180) {
      return { zoom: clamp(m[0], 2, 20), lat: m[1], lon: m[2], bearing: Number.isFinite(m[3]) ? m[3] : 0, pitch: Number.isFinite(m[4]) ? clamp(m[4], 0, 70) : 0 };
    }
    return null;
  },
  build() {
    const c = map.getCenter();
    const b = Math.round(map.getBearing()), p = Math.round(map.getPitch());
    const parts = [`map=${map.getZoom().toFixed(2)}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}${b || p ? `/${b}/${p}` : ''}`];
    if (S.cat) parts.push(`c=${S.cat.id}`);
    if (S.cat && S.openOnly) parts.push('oo=1');
    const pl = S.place;
    if (pl) {
      if (pl.source !== 'nominatim' && pl.osmType && pl.osmId) parts.push(`o=${pl.osmType[0]}${pl.osmId}`);
      else parts.push(`pt=${pl.lat.toFixed(5)},${pl.lon.toFixed(5)}`);
    }
    const r = S.route;
    if (r.a || r.b) {
      const pt = (x) => x ? `${x.lat.toFixed(5)},${x.lon.toFixed(5)}` : '';
      parts.push(`r=${r.mode}~${pt(r.a)}~${pt(r.b)}~${r.active}`);
      if (r.a) parts.push(`ra=${encodeURIComponent(r.a.label)}`);
      if (r.b) parts.push(`rb=${encodeURIComponent(r.b.label)}`);
    }
    return parts.join('&');
  },
  write() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 250); },
  flush() {
    clearTimeout(this.timer);
    if (!map) return;
    const h = this.build();
    if (h === this.last) return;
    this.last = h;
    try { history.replaceState(null, '', `#${h}`); } catch (e) { /* file:// в некоторых браузерах */ }
  },
  parseRoute(h) {
    if (!h.r) return null;
    const [mode, a, b, idx] = h.r.split('~');
    const pt = (s, label) => {
      const [lat, lon] = String(s || '').split(',').map(Number);
      return Number.isFinite(lat) && Number.isFinite(lon) ? { lat, lon, label: label || 'Точка на карте' } : null;
    };
    return {
      mode: MODES.some(m => m.id === mode) ? mode : 'car',
      a: pt(a, h.ra), b: pt(b, h.rb), active: Number(idx) || 0
    };
  },
  /** Восстанавливает рубрику, маршрут и карточку из ссылки. */
  apply(h, { initial = false } = {}) {
    const cam = this.camera(h);
    if (!initial && cam) map.jumpTo({ center: [cam.lon, cam.lat], zoom: cam.zoom, bearing: cam.bearing, pitch: cam.pitch });
    if (cam && cam.pitch > 12) ThreeD.set(true, false);

    if (h.c && CAT_BY_ID[h.c]) {
      S.openOnly = h.oo === '1';
      if (!S.cat || S.cat.id !== h.c) Cat.run(h.c);
    } else if (S.cat) Cat.clear();

    const r = this.parseRoute(h);
    if (r && (r.a || r.b)) {
      Object.assign(S.route, { mode: r.mode, a: r.a, b: r.b, active: r.active });
      Panel.show('route');
      M.setAB();
      Route.render();
      if (r.a && r.b) Route.compute({ fit: !cam, keepActive: true });
    } else if (S.route.a || S.route.b) Route.clear();

    if (h.o) {
      const type = { n: 'node', w: 'way', r: 'relation' }[h.o[0]];
      const id = h.o.slice(1);
      if (type && /^\d+$/.test(id) && (!S.place || S.place.key !== `${type}/${id}`)) Place.openById(type, id, { fly: !cam });
    } else if (h.pt) {
      const [lat, lon] = h.pt.split(',').map(Number);
      if (Number.isFinite(lat) && Number.isFinite(lon)) Place.openPoint(lat, lon, { fly: !cam });
    } else if (S.place) Place.close();

    Panel.stack = ['home', S.cat && 'results', (S.route.a || S.route.b) && 'route', S.place && 'place'].filter(Boolean);
    Panel.apply();
    this.flush();
  }
};

  const c = S.cat;
  if (!c || c.status === 'loading') { UI.searchAreaBtn.hidden = true; return; }
  const box = M.visibleBbox();
  const [w, s, e, n] = c.bbox;
  const cw = Math.max(1e-4, e - w), ch = Math.max(1e-4, n - s);
  const moved = Math.abs((box[0] + box[2]) / 2 - (w + e) / 2) > cw * 0.25 || Math.abs((box[1] + box[3]) / 2 - (s + n) / 2) > ch * 0.25;
  const zoomed = Math.abs(map.getZoom() - c.zoom) > 0.8;
  UI.searchAreaBtn.hidden = !(moved || zoomed);

    spin: $('#qSpin'), clearBtn: $('#qClear'),
    onPick(it) {
      if (it.kind === 'category') { Cat.run(it.cat.id); UI.q.blur(); return; }
      UI.searchSuggest.reset(placeTitle(it.place));
      UI.q.blur();
      Place.open(it.place, { fly: true, extent: it.place.kind === 'org' || it.place.kind === 'house' ? null : it.place.extent });
    }
  });
  UI.q.addEventListener('focus', () => { if (isMobile()) Sheet.set('full'); });
  $('#qClear').addEventListener('click', () => {
    UI.searchSuggest.reset('');
    if (S.cat) { if (Panel.current() === 'results') Panel.back(); else Cat.clear(); }
    UI.q.focus();
  });

  // --- поля маршрута ---
  const routeField = (which, input) => {
    const wrap = input.closest('.search');
    const sg = new Suggest(input, $('.suggest', wrap), {
      categories: false, spin: $('.spin', wrap), clearBtn: $('[data-clear]', wrap),
      onPick(it) {
        input.blur();
        Route.setPoint(which, { lat: it.place.lat, lon: it.place.lon, label: placeTitle(it.place) });
      }
    });
    input.addEventListener('focus', () => { input.select(); if (isMobile()) Sheet.set('full'); });
    input.addEventListener('blur', () => setTimeout(() => {
      if (document.activeElement !== input && S.route[which]) input.value = S.route[which].label;
    }, 150));
    $('[data-clear]', wrap).addEventListener('click', () => {
      sg.reset('');
      S.route[which] = null;
      M.setAB();
      Route.compute();
      input.focus();
    });
    return sg;
  };
  UI.rASuggest = routeField('a', UI.rA);
  UI.rBSuggest = routeField('b', UI.rB);
  $('#rSwap').addEventListener('click', () => Route.swap());
  $('#rMyLoc').addEventListener('click', () => {
    Geo.locate({ fly: false }).then(p => Route.setPoint('a', { lat: p.lat, lon: p.lon, label: 'Моё местоположение' })).catch(() => {});
  });
  $('#modes').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]');
    if (b) Route.setMode(b.dataset.mode);
  });

  // --- рубрики ---
  UI.chips.addEventListener('click', (e) => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    if (S.cat && S.cat.id === b.dataset.cat) { if (Panel.current() === 'results') Panel.back(); else Cat.clear(); }
    else Cat.run(b.dataset.cat);
  });
  UI.searchAreaBtn.addEventListener('click', () => { if (S.cat) Cat.run(S.cat.id); });

  // --- делегирование кликов в панели ---
  Panel.body.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act],[data-id],[data-sort],[data-alt],.step');
    if (!t) return;
    if (t.dataset.id) {
      const it = Cat.find(t.dataset.id);
      if (it) Place.open(it, { fly: true });
      return;
    }
    if (t.dataset.sort) {
      const want = t.dataset.sort;
      if (want === 'user' && !S.user) {
        Geo.locate({ fly: false }).then(() => { S.sort = 'user'; Cat.render(); Cat.syncMap(); }).catch(() => {});
        return;
      }
      S.sort = want;
      Cat.render(); Cat.syncMap();
      return;
    }
    if (t.dataset.alt) { Route.select(Number(t.dataset.alt)); return; }
    if (t.classList.contains('step')) { Route.focusStep(Number(t.dataset.i)); return; }
    const p = S.place;
    switch (t.dataset.act) {
      case 'back': Panel.back(); break;
      case 'close-results': UI.searchSuggest.reset(''); Panel.back(); break;
      case 'retry-cat': if (S.cat) Cat.run(S.cat.id, { bbox: S.cat.bbox }); break;
      case 'open-now': S.openOnly = !S.openOnly; Cat.render(); Cat.syncMap(); Hash.write(); break;
      case 'route-to': if (p) Route.open({ b: Place.asPoint(p) }); break;
      case 'route-from': if (p) Route.open({ a: Place.asPoint(p) }); break;
      case 'share': Place.share(); break;
      case 'open-route': Route.open(); break;
      case 'route-close': Panel.back(); break;
      case 'retry-route': Route.compute({ fit: true }); break;
      case 'use-my-loc': $('#rMyLoc').click(); break;
    }
  });
  Panel.body.addEventListener('mouseover', (e) => {
    const row = e.target.closest('.res-item');
    if (row) setHover(row.dataset.id, 'list');
  });
  Panel.body.addEventListener('mouseleave', () => { if (S.hoverId) setHover(null); });
  $('#vResults').addEventListener('mouseleave', () => { if (S.hoverId) setHover(null); });

  // --- кнопки карты ---
  $('#zoomIn').addEventListener('click', () => map.zoomIn());
  $('#zoomOut').addEventListener('click', () => map.zoomOut());
  UI.locateBtn.addEventListener('click', () => { Geo.locate({ fly: true }).catch(() => {}); });
  UI.btn3d.addEventListener('click', () => ThreeD.set(!S.is3D));
  UI.themeBtn.addEventListener('click', () => Theme.toggle());

  UI.ctx.addEventListener('click', (e) => {
    const b = e.target.closest('[data-ctx]');
    if (b) Ctx.act(b.dataset.ctx);
  });
  document.addEventListener('pointerdown', (e) => {
    if (!UI.ctx.hidden && !UI.ctx.contains(e.target)) Ctx.close();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!UI.ctx.hidden) { Ctx.close(); return; }
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT') return;
      if (S.view === 'place' || S.view === 'results') Panel.back();
    } else if (e.key === '/' && document.activeElement === document.body) {
      e.preventDefault();
      UI.q.focus();
    }
  });
  window.addEventListener('hashchange', () => {
    if (location.hash.slice(1) === Hash.last) return;
    Hash.apply(Hash.parse(location.hash));
  });
}

function bindMap() {
  let suppressClickUntil = 0;
  const interactive = ['k-hl', 'k-poi-icon', 'k-poi-cluster', 'k-route-alt'];

  map.on('click', (e) => {
    if (Date.now() < suppressClickUntil) return; // отпустили палец после долгого нажатия — меню не закрываем
    Ctx.close();
    const f = M.layersAt(e.point, interactive);
    if (f) {
      const id = f.layer.id;
      if (id === 'k-poi-icon' || id === 'k-hl') {
        const it = Cat.find(f.properties.id);
        if (it) Place.open(it, { fly: false });
        return;
      }
      if (id === 'k-poi-cluster') {
        const src = map.getSource('k-poi');
        const center = f.geometry.coordinates;
        src.getClusterExpansionZoom(f.properties.cluster_id)
          .then(z => map.easeTo({ center, zoom: Math.min(z + 0.3, 18), duration: 600 }))
          .catch(() => map.easeTo({ center, zoom: map.getZoom() + 2 }));
        return;
      }
      if (id === 'k-route-alt') { Route.select(Number(f.properties.idx)); return; }
    }
    Place.openPoint(e.lngLat.lat, e.lngLat.lng);
  });

  map.on('contextmenu', (e) => {
    if (e.originalEvent) e.originalEvent.preventDefault();
    Ctx.open(e.lngLat, e.point);
  });

  // Долгое нажатие на телефоне
  const mapEl = map.getContainer();
  let lp = null;
  const cancelLp = () => { if (lp) { clearTimeout(lp.timer); lp = null; } };
  mapEl.addEventListener('touchstart', (e) => {
    cancelLp();
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    lp = {
      x: t.clientX, y: t.clientY,
      timer: setTimeout(() => {
        const rect = mapEl.getBoundingClientRect();
        const pt = { x: t.clientX - rect.left, y: t.clientY - rect.top };
        suppressClickUntil = Date.now() + 900;
        Ctx.open(map.unproject([pt.x, pt.y]), pt);
        lp = null;
      }, 550)
    };
  }, { passive: true });
  mapEl.addEventListener('touchmove', (e) => {
    if (!lp) return;
    const t = e.touches[0];
    if (e.touches.length > 1 || Math.hypot(t.clientX - lp.x, t.clientY - lp.y) > 10) cancelLp();
  }, { passive: true });
  mapEl.addEventListener('touchend', cancelLp);
  mapEl.addEventListener('touchcancel', cancelLp);

  // Наведение: маркер ↔ строка списка
  let raf = 0, lastPoint = null;
  map.on('mousemove', (e) => {
    lastPoint = e.point;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const f = M.layersAt(lastPoint, interactive);
      map.getCanvas().style.cursor = f ? 'pointer' : '';
      const id = f && (f.layer.id === 'k-poi-icon' || f.layer.id === 'k-hl') ? f.properties.id : null;
      if (id !== S.hoverId && (id || S.view !== 'results' || !$('.res-item.hover:hover'))) setHover(id, 'map');
    });
  });
  mapEl.addEventListener('mouseleave', () => { map.getCanvas().style.cursor = ''; });

  map.on('movestart', () => Ctx.close());
  map.on('moveend', () => { Hash.write(); checkSearchArea(); });
  map.on('pitchend', () => ThreeD.sync());
}

/* =====================================================================
   19. СТАРТ
   ===================================================================== */
async function init() {
  bindUi();
  const saved = lsGet('korset.theme');
  const theme = saved === 'dark' || saved === 'light' ? saved
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  Theme.applyUi(theme);
  ThreeD.set(false, false);
  Sheet.init();
  Panel.apply();
  Sheet.layout();

  if (!window.maplibregl) {
    showFatal('Не удалось загрузить карту', 'Библиотека MapLibre не загрузилась. Проверьте подключение к интернету и обновите страницу.');
    return;
  }
  if (typeof maplibregl.supported === 'function' && !maplibregl.supported()) {
    showFatal('Браузер не поддерживает WebGL', 'Откройте демо в свежей версии Chrome, Safari, Edge или Firefox.');
    return;
  }

  const h = Hash.parse(location.hash);
  const cam = Hash.camera(h) || { lat: CITY.center.lat, lon: CITY.center.lon, zoom: CITY.zoom, bearing: 0, pitch: 0 };
  let style = STYLE_URLS[S.theme];
  try { style = structuredClone(await Theme.loadStyle(S.theme)); } catch (e) { /* пусть MapLibre загрузит стиль сам и покажет ошибку */ }
  try {
    M.init(cam, style);
  } catch (e) {
    showFatal('Не удалось запустить карту', 'Похоже, в браузере отключён WebGL. Попробуйте другой браузер или включите аппаратное ускорение.');
    return;
  }
  bindMap();

  Hours.load().then(() => {
    if (S.cat && S.cat.status === 'ok') { Cat.render(); Cat.syncMap(); }
    if (S.view === 'place') renderPlace();
  });
  City.init();

  map.once('load', () => {
    Hash.apply(h, { initial: true });
    // Прогреваем второй стиль, чтобы смена темы была мгновенной.
    setTimeout(() => { Theme.loadStyle(S.theme === 'dark' ? 'light' : 'dark').catch(() => {}); }, 2500);
  });
}

init().catch(() => showFatal('Не удалось запустить карту', 'Обновите страницу. Если ошибка повторится — откройте демо в другом браузере.'));
})();
</script>
